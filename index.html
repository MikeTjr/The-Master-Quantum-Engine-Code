
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Sandbox Engine V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #08111f 0%, #010409 100%);
    color: white;
    font-family: Inter, sans-serif;
}
canvas {
    display:block;
}
#overlay {
    position:absolute;
    top:20px;
    left:20px;
    width:360px;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.1);
    padding:20px;
    border-radius:16px;
    backdrop-filter: blur(10px);
}
#overlay h1 {
    margin-top:0;
    font-size:28px;
}
#tooltip {
    margin-top:12px;
    line-height:1.5;
    font-size:15px;
    color:#d8e7ff;
}
#controls {
    margin-top:20px;
}
button {
    background:#0f203d;
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>
<body>
<div id="overlay">
    <h1>Quantum Sandbox Engine</h1>
    <p>Educational symbolic simulation environment exploring resonance, interaction, and collective field dynamics.</p>
    <div id="tooltip">
        Hover explanations and simulation overlays will appear here in future updates.
    </div>
    <div id="controls">
        <button id="simulationBtn">Activate Simulation</button>
    </div>
</div>

<canvas id="scene"></canvas>

<script type="module">
import { HumanRenderer } from './humanRenderer.js';
import { SimulationEngine } from './simulationEngine.js';
import { TooltipSystem } from './tooltipSystem.js';

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const humans = [
    new HumanRenderer(canvas.width * 0.35, canvas.height * 0.55),
    new HumanRenderer(canvas.width * 0.65, canvas.height * 0.55)
];

const engine = new SimulationEngine(humans);
const tooltip = new TooltipSystem(document.getElementById('tooltip'));

document.getElementById('simulationBtn').addEventListener('click', () => {
    engine.toggleSimulation();
});

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    engine.update();

    humans.forEach(human => {
        human.update();
        human.draw(ctx);
    });

    tooltip.update(engine);

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>

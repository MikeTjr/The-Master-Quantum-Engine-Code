<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

body, html {

/* ── CANVAS ── */
#quantum-stage {

}

/* ── UI OVERLAY ── */
.immersive-ui {

}
.immersive-ui.hidden { opacity: 0; visibility: hidden; }
.immersive-ui * { pointer-events: auto; }

}
.brand-block p {

}

.header-controls {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}

/* ── PROXIMITY DOCK ── */
.proximity-dock {

}

  color: var(--gold-pure);
}
.proximity-slider {

  border-radius: 2px; outline: none;
}

  -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
  background: var(--ice-blue); cursor: pointer;
  box-shadow: 0 0 10px var(--ice-blue), 0 0 20px rgba(126,184,212,0.4);
}

/* ── DROPDOWN ── */
.quantum-dropdown {
  background: var(--panel-bg); border: 1px solid var(--border-subtle);
  color: #fff; padding: 10px 18px; border-radius: 28px;
  font-family: 'Space Mono', monospace; font-size: 0.72rem; letter-spacing: 0.3px;
  outline: none; cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  max-width: 400px; transition: border-color 0.3s;
}
.quantum-dropdown:hover { border-color: var(--border-gold); }
.quantum-dropdown optgroup { background: #050c1a; color: #4a6070; font-size: 0.7rem; }
.quantum-dropdown option { background: #070f20; color: #fff; }

  padding: 10px 16px; border-radius: 36px; cursor: pointer;
  display: flex; align-items: center; gap: 9px; transition: all 0.35s ease;
}
.cosmic-amplifier-btn.active {
  background: linear-gradient(135deg, rgba(200,168,75,0.18), rgba(0,0,0,0.85));
  border-color: var(--gold-pure);
  box-shadow: 0 0 22px var(--gold-glow), inset 0 0 12px rgba(200,168,75,0.08);
}
.cosmic-amplifier-btn .indicator {
  width: 7px; height: 7px; background: var(--text-muted); border-radius: 50%;
  transition: all 0.3s;
}
.cosmic-amplifier-btn.active .indicator {
  background: var(--gold-pure); box-shadow: 0 0 12px var(--gold-pure);
}
.cosmic-amplifier-btn span {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.8px; color: var(--text-light);
}

}
.entanglement-badge label {
  font-size: 0.58rem; text-transform: uppercase; letter-spacing: 2px;
  color: var(--ice-blue);
}
.entanglement-dots {
  display: flex; gap: 5px;
}
.entanglement-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1px solid rgba(126,184,212,0.3);
  background: transparent; transition: all 0.4s ease;
}
.entanglement-dot.lit {
  background: var(--ice-blue);
  box-shadow: 0 0 8px var(--ice-blue), 0 0 16px rgba(126,184,212,0.4);
}

/* ── PHASE TOGGLES ── */

  display: flex; gap: 10px; margin-bottom: 12px;
}
.phase-toggle {
  background: rgba(3,8,18,0.65); border: 1px solid var(--border-subtle);
  color: var(--text-muted); padding: 9px 16px; border-radius: 28px;
  font-family: 'Space Mono', monospace; font-size: 0.65rem;
  text-transform: uppercase; letter-spacing: 1.8px; cursor: pointer;
  transition: all 0.3s ease;
}
.phase-toggle.active {
  background: rgba(255,255,255,0.07); color: #fff; border-color: var(--gold-pure);
  text-shadow: 0 0 12px rgba(200,168,75,0.6);
}

/* ── INSIGHT DOCK ── */
.insight-dock {
  display: grid; grid-template-columns: 1fr 360px; gap: 24px;
  width: 100%; background: var(--panel-bg);

}

  font-size: 0.78rem; line-height: 1.65; color: #94aab8;

}

.atomic-panel {

  display: flex; flex-direction: column; gap: 14px;
}
.atomic-group h4 {
  font-size: 0.56rem; text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-muted); margin-bottom: 5px;

.atomic-stat-lbl {

.biophoton-bar-container {
  width: 100%; height: 3px; background: rgba(255,255,255,0.05);
  border-radius: 2px; overflow: hidden;
}
.biophoton-bar {
  height: 100%; width: 50%;
  transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);

  .quantum-dropdown { max-width: 100%; width: 100%; }

/* ── SCAN LINE OVERLAY ── */

  pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);

function project(x3d, y3d, z3d, cx, cy, camAngle) {
  const cos = Math.cos(camAngle), sin = Math.sin(camAngle);
  const rx = x3d * cos - z3d * sin;
  const rz = x3d * sin + z3d * cos;
  const fl = 500, cd = 580;
  const sc = fl / (cd + rz);
  return { x: cx + rx * sc, y: cy + y3d * sc, scale: sc, depth: rz };
}

    } else if (fi === 1) {
      // ── TYPE 1: HEART TOROIDAL FIELD ENVELOPE ────────────────
      // Primary torus — heart-centered, pulsing outward
      const ringIdx = i % 16;
      const loopAngle = ((i * 0.048) + t * 0.85) % (Math.PI * 2);
      const shellAngle = (ringIdx * Math.PI) / 16;

      // Heart center slightly above geometric center (~chest height)
      const heartY = -20;

      let majorR = 148 + Math.sin(t * 1.8 + ringIdx * 0.4) * 22 * coherence;
      let minorR = 52 + Math.cos(t * 2.2 + i * 0.01) * 12 * coherence;

      if (coherence < 0.42) {
        majorR += Math.sin(i * 0.3 + t * 4.5) * 55 * (1 - coherence);
        minorR += Math.cos(i * 0.2 - t * 4.5) * 28 * (1 - coherence);
      }

      let tx = bodyRef.xOff + (majorR + minorR * Math.cos(loopAngle)) * Math.cos(shellAngle);
      let ty = heartY + minorR * Math.sin(loopAngle);
      let tz = (majorR + minorR * Math.cos(loopAngle)) * Math.sin(shellAngle);

      // Field entanglement — torus loops stretch toward other bodies
      if (bodies.length > 1) {
        const pullFactor = 0.12 * coherence;
        for (const ob of bodies) {
          if (ob !== bodyRef) {
            tx += (ob.xOff - bodyRef.xOff) * pullFactor * Math.abs(Math.cos(loopAngle));
          }
        }
      }

      p.x3d += (tx - p.x3d) * 0.075;
      p.y3d += (ty - p.y3d) * 0.075;
      p.z3d += (tz - p.z3d) * 0.075;

      if (appState.amplifierActive) {
        p.x3d += Math.sin(p.seed + t * 3.5) * 7;
        p.y3d += Math.cos(p.seed2 - t * 3.5) * 7;
      }

      const sp = project(p.x3d, p.y3d, p.z3d, cx, cy, camAngle);
      if (sp.scale > 0) {
        let col;
        if (appState.amplifierActive && Math.random() > 0.68) {
          col = `rgba(200, 168, 75, ${p.alpha * coherence})`;
        } else {
          col = hexToRgba(data.color, p.alpha * coherence * Math.min(1, sp.scale * 1.05));
        }
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size * sp.scale, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (fi === 2) {
      // ── TYPE 2: OUTER TOROIDAL CORONA RING ───────────────────
      // Reference image: large glowing ring surrounding the figure
      const coronaAngle = (i * 0.042 + t * 0.55) % (Math.PI * 2);
      const coronaR = 200 + Math.sin(t * 1.2 + i * 0.05) * 18 * coherence;
      const coronaTilt = 0.28; // slight tilt for 3D feel

      let tx = bodyRef.xOff + Math.cos(coronaAngle) * coronaR;
      let ty = Math.sin(coronaAngle) * coronaR * coronaTilt;
      let tz = Math.sin(coronaAngle * 0.7 + t * 0.3) * 30;

      if (coherence < 0.4) {
        tx += Math.sin(i + t * 5) * 40 * (1 - coherence);
        ty += Math.cos(i - t * 5) * 20 * (1 - coherence);
      }

      p.x3d += (tx - p.x3d) * 0.09;
      p.y3d += (ty - p.y3d) * 0.09;
      p.z3d += (tz - p.z3d) * 0.09;

      const sp = project(p.x3d, p.y3d, p.z3d, cx, cy, camAngle);
      if (sp.scale > 0) {
        // Ice-blue glow ring (matches reference image)
        const ringAlpha = p.alpha * coherence * 0.7 * Math.min(1, sp.scale * 1.3);
        ctx.fillStyle = `rgba(126, 200, 240, ${ringAlpha})`;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size * sp.scale * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }

    } else {
      // ── TYPE 3: ENVIRONMENTAL GRID LANDSCAPE ─────────────────
      const gx = ((i * 19) % 1400) - 700;
      const gz = ((i * 29) % 1400) - 700;
      let gy = 175;

      const dist = Math.sqrt(gx * gx + gz * gz);
      let ripple = Math.sin(dist * 0.018 - t * 3.2) * 28 * coherence;

      if (coherence < 0.42) {
        ripple += Math.cos(gx * 0.09) * data.complexity * 0.45;
      }
      gy += ripple;

      p.x3d += (gx - p.x3d) * 0.095;
      p.y3d += (gy - p.y3d) * 0.095;
      p.z3d += (gz - p.z3d) * 0.095;

      const sp = project(p.x3d, p.y3d, p.z3d, cx, cy, camAngle);
      if (sp.scale > 0 && sp.scale < 1.5) {
        const ga = p.alpha * coherence * 0.45 * Math.min(1, sp.scale * 1.4);
        ctx.fillStyle = hexToRgba(data.color, ga);
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size * sp.scale * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ── DRAW HEART CENTER GLOW ────────────────────────────────────
  for (const b of bodies) {
    const hc = project(b.xOff, -20, 0, cx, cy, camAngle);
    if (hc.scale > 0) {
      const pulse = 0.55 + 0.45 * Math.sin(t * 7.5);
      const glowR = 38 * hc.scale * (0.8 + 0.2 * coherence);
      const grad = ctx.createRadialGradient(hc.x, hc.y, 0, hc.x, hc.y, glowR * (1 + pulse * 0.3));
      grad.addColorStop(0, `rgba(255, 255, 255, ${0.55 * coherence * pulse})`);
      grad.addColorStop(0.3, `rgba(180, 220, 255, ${0.28 * coherence})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(hc.x, hc.y, glowR * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(runUniversePipeline);
}

// ── HELPERS ──────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  if (!hex) return `rgba(126,184,212,${alpha})`;
  if (hex.startsWith('hsl')) {
    return hex.replace(/^hsl\(/, 'hsla(').replace(/\)$/, `,${alpha})`);
  }
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `rgba(${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)},${alpha})` : `rgba(126,184,212,${alpha})`;
}

// ── UI FADE ───────────────────────────────────────────────────────
function triggerUIFadeSequence() {
  clearTimeout(appState.uiTimer);
  if (!appState.uiVisible) {
    appState.uiVisible = true;
    document.getElementById('ui-overlay').classList.remove('hidden');
    document.getElementById('ui-restorer-btn').classList.remove('visible');
  }
  appState.uiTimer = setTimeout(() => {
    appState.uiVisible = false;
    document.getElementById('ui-overlay').classList.add('hidden');
    document.getElementById('ui-restorer-btn').classList.add('visible');
  }, 2200);
}

// ── UPDATE UI ELEMENTS ────────────────────────────────────────────
function updateUIElements() {
  const d = frequencyCatalog[appState.activeKey];
  document.getElementById('field-title').innerText = d.name;
  document.getElementById('field-origin').innerText = d.origin;
  document.getElementById('field-desc').innerText = d.desc;
  document.getElementById('field-photon-lbl').innerText = d.photonLbl;
  document.getElementById('field-flow-desc').innerText = d.flowDesc;

  const bar = document.getElementById('photon-metric-bar');
  bar.style.width = d.photonWidth;
  bar.style.backgroundColor = d.color;
  bar.style.boxShadow = `0 0 14px ${d.color}`;

  // Coherence ring
  const co = parseFloat(d.coherence);
  const circumference = 113;
  const offset = circumference - co * circumference;
  const arc = document.getElementById('coherence-arc');
  arc.style.strokeDashoffset = offset;
  arc.style.stroke = co > 0.7 ? '#7eb8d4' : co > 0.4 ? '#c8a84b' : '#ef4444';
  document.getElementById('coherence-pct').textContent = Math.round(co * 100) + '%';

  const labels = ['Critical Noise', 'Fragmented', 'Developing', 'Stabilizing', 'Coherent', 'Peak Resonance'];
  const li = Math.min(5, Math.floor(co * 6));
  document.getElementById('coherence-label-strong').textContent = labels[li];

  triggerUIFadeSequence();
}

// ── ENTANGLEMENT DOTS ─────────────────────────────────────────────
function updateEntanglementDots(count) {
  for (let i = 1; i <= 3; i++) {
    document.getElementById(`dot-${i}`).classList.toggle('lit', i <= count);
  }
}

// ── EVENT HANDLERS ────────────────────────────────────────────────
function handleDropdownShift(val) { appState.activeKey = val; updateUIElements(); }

function handleProximityShift(val) {
  appState.proximityCount = parseInt(val, 10);
  updateEntanglementDots(appState.proximityCount);
  triggerUIFadeSequence();
}

function togglePhaseState(state) {
  appState.phaseState = state;
  document.getElementById('phase-before').classList.toggle('active', state === 'before');
  document.getElementById('phase-after').classList.toggle('active', state === 'after');
  triggerUIFadeSequence();
}

function toggleCosmicAmplifier() {
  appState.amplifierActive = !appState.amplifierActive;
  document.getElementById('cosmic-amp').classList.toggle('active', appState.amplifierActive);
  triggerUIFadeSequence();
}

// ── DROPDOWN SETUP ────────────────────────────────────────────────
function setupDropdownOptions() {
  const dd = document.getElementById('vector-selector');
  dd.innerHTML = '';
  const groups = {
    "BIO-ENERGETICS": ["bio-delta","bio-theta","bio-schumann","bio-alpha","bio-sensory","bio-beta","bio-gamma","bio-hyper","heart-baseline","vagus-nerve"],
    "SOLFEGGIO & ANCIENT ACOUSTICS": ["sol-396","sol-417","sol-432","sol-528","sol-639","sol-741","sol-852","sol-963","anc-jericho","anc-david","anc-egypt","anc-tibetan"],
    "TECHNICAL INFRASTRUCTURE & EMF": ["tech-60hz","tech-wifi","tech-5g","tech-bluetooth","tech-led","tech-smart","tech-haarp","tech-6g","tech-satellite","tech-ev"],
    "QUANTUM FIELD ARRAY ARCHIVE": []
  };
  for (let i = 1; i <= 70; i++) groups["QUANTUM FIELD ARRAY ARCHIVE"].push(`gen-slot-${i}`);
  for (const [g, keys] of Object.entries(groups)) {
    const grp = document.createElement('optgroup');
    grp.label = g;
    keys.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.innerText = frequencyCatalog[k].name;
      if (k === appState.activeKey) opt.selected = true;
      grp.appendChild(opt);
    });
    dd.appendChild(grp);
  }
}

// ── BOOT ──────────────────────────────────────────────────────────
window.addEventListener('resize', resizeStage);
window.addEventListener('mousemove', triggerUIFadeSequence);
window.addEventListener('touchstart', triggerUIFadeSequence);
document.getElementById('ui-restorer-btn').addEventListener('click', e => {
  e.stopPropagation(); triggerUIFadeSequence();
});

window.addEventListener('DOMContentLoaded', () => {
  setupDropdownOptions();
  resizeStage();
  updateUIElements();
  runUniversePipeline();
});
</script>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uFrequency;
        uniform float uVelocity;
        uniform float uDamping;
        uniform float uAbsorption;
        vec3 uHumanPos1;
        vec3 uHumanPos2;
        
        varying vec3 vPosition;
        varying float vDisplacement;
        varying vec2 vUv;

        // Custom mathematical function generating structural Chladni standing nodes
        float computeChladniVibration(vec3 positionVector, vec3 waveOriginSource, float frequency, float speedOfSound, float globalTimeline) {
            float distanceMagnitude = distance(positionVector.xz, waveOriginSource.xz);
            if (distanceMagnitude < 0.1) distanceMagnitude = 0.1;
            
            // Angular wave velocity wavenumber equation
            float waveNumberK = (2.0 * 3.1415926535 * frequency) / speedOfSound;
            
            // Standing wave resonance components mapping structural biological grid intersections
            float planarResonanceX = sin(waveNumberK * positionVector.x) * sin(waveNumberK * positionVector.z);
            float planarResonanceZ = cos(waveNumberK * positionVector.x) * cos(waveNumberK * positionVector.z);
            
            // Outward spatial radial wave dissipation mapping 
            float radialPropagation = sin(distanceMagnitude * waveNumberK - globalTimeline) * (1.0 / sqrt(distanceMagnitude));
            
            return (planarResonanceX + planarResonanceZ) * 0.35 * radialPropagation;
        }

        void main() {
            // Reconstructed uniform bindings mapped to absolute mathematical position states
            uHumanPos1 = vec3(attributeMatrixOffset1, 0.0, attributeMatrixOffset2);
            uHumanPos2 = vec3(attributeMatrixOffset3, 0.0, attributeMatrixOffset4);

            vUv = uv;
            vec3 rawPosition = position;
            
            float calculatedWaveA = computeChladniVibration(rawPosition, uHumanPos1, uFrequency, uVelocity, uTime);
            float calculatedWaveB = computeChladniVibration(rawPosition, uHumanPos2, uFrequency, uVelocity, uTime);
            
            // Superposition calculation describing shared vibrational states between human centers
            float physicalWaveSuperposition = (calculatedWaveA + calculatedWaveB) * (1.0 - uAbsorption);
            
            rawPosition.y += physicalWaveSuperposition;
            vDisplacement = physicalWaveSuperposition;
            vPosition = rawPosition;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(rawPosition, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform float uBackgroundNoise;
        
        varying vec3 vPosition;
        varying float vDisplacement;
        varying vec2 vUv;

        void main() {
            // Translate absolute wave peak displacements into visual luminance boundaries
            float waveDisplacementIntensity = clamp(abs(vDisplacement) * 1.6, 0.0, 1.0);
            
            vec3 coreDeepSpaceBackground = mix(vec3(0.015, 0.03, 0.06), uColor1, waveDisplacementIntensity);
            vec3 dynamicPhaseEdgeShift = mix(coreDeepSpaceBackground, uColor2, sin(vPosition.y * 2.5) * 0.5 + 0.5);
            
            // Infuse background micro-noise matrices directly into pixel mapping layers
            float fragmentCalculatedNoise = sin(gl_FragCoord.x * 0.45) * cos(gl_FragCoord.y * 0.45) * uBackgroundNoise * 0.05;
            
            gl_FragColor = vec4(dynamicPhaseEdgeShift + vec3(fragmentCalculatedNoise), 0.38 + waveDisplacementIntensity * 0.45);
        }
    </script>

            });

            // Cranium (Anatomically mapped relative head height)
            const craniumGeometry = new THREE.SphereGeometry(0.35, 20, 20);
            craniumGeometry.scale(1, 1.28, 1); // Academic oval cranium mapping
            const headMeshNode = new THREE.Mesh(craniumGeometry, highFidelityWireframeMaterial);
            headMeshNode.position.y = 4.05;
            structuralAnatomicalGroup.add(headMeshNode);

            // Cervical Spine (Neck Vector Connection)
            const cervicalNeckGeometry = new THREE.CylinderGeometry(0.12, 0.15, 0.32, 16);
            const neckMeshNode = new THREE.Mesh(cervicalNeckGeometry, highFidelityWireframeMaterial);
            neckMeshNode.position.y = 3.52;
            structuralAnatomicalGroup.add(neckMeshNode);

            // Thoracic Ribcage Core Cage Assembly
            const torsoRibcageGeometry = new THREE.CylinderGeometry(0.54, 0.36, 1.45, 20);
            torsoRibcageGeometry.scale(1.25, 1, 0.7); // Precise cross-sectional depth
            const torsoMeshNode = new THREE.Mesh(torsoRibcageGeometry, highFidelityWireframeMaterial);
            torsoMeshNode.position.y = 2.78;
            structuralAnatomicalGroup.add(torsoMeshNode);

            // Pelvic Girdle Base Shield
            const pelvicGirdleGeometry = new THREE.CylinderGeometry(0.36, 0.45, 0.58, 20);
            pelvicGirdleGeometry.scale(1.18, 1, 0.8);
            const pelvisMeshNode = new THREE.Mesh(pelvicGirdleGeometry, highFidelityWireframeMaterial);
            pelvisMeshNode.position.y = 1.98;
            structuralAnatomicalGroup.add(pelvisMeshNode);

            // Left & Right Upper Extremities (Arm Appendages)
            const armCylinderGeometry = new THREE.CylinderGeometry(0.11, 0.08, 1.5, 14);
            
            const leftArmMeshNode = new THREE.Mesh(armCylinderGeometry, highFidelityWireframeMaterial);
            leftArmMeshNode.position.set(-0.8, 2.75, 0);
            leftArmMeshNode.rotation.z = 0.14;
            structuralAnatomicalGroup.add(leftArmMeshNode);

            const rightArmMeshNode = leftArmMeshNode.clone();
            rightArmMeshNode.position.x = 0.8;
            rightArmMeshNode.rotation.z = -0.14;
            structuralAnatomicalGroup.add(rightArmMeshNode);

            // Left & Right Lower Extremities (Leg Axials)
            const legCylinderGeometry = new THREE.CylinderGeometry(0.19, 0.11, 1.95, 16);
            
            const leftLegMeshNode = new THREE.Mesh(legCylinderGeometry, highFidelityWireframeMaterial);
            leftLegMeshNode.position.set(-0.35, 0.98, 0);
            structuralAnatomicalGroup.add(leftLegMeshNode);

            const rightLegMeshNode = leftLegMeshNode.clone();
            rightLegMeshNode.position.x = 0.35;
            structuralAnatomicalGroup.add(rightLegMeshNode);

            return structuralAnatomicalGroup;
        }

        const biologicalHumanA = constructCollegeLevelAnatomicalMesh();
        const biologicalHumanB = constructCollegeLevelAnatomicalMesh();
        scene.add(biologicalHumanA);
        scene.add(biologicalHumanB);

        // --- 6. PRECISE DYNAMIC 3D PARAMETRIC TOROIDAL FIELDS ---
        // Strict mapping tracking standard parametric torus equation matrices centered at $(0,0,0)$ local origin chest areas
        function generateParametricVectorToroid(colorHexCode) {
            const torusWrapperGroup = new THREE.Group();
            
            const R_MajorRadius = 2.6; 
            const r_MinorRadius = 1.3; 
            const structuralU_Steps = 54;
            const structuralV_Steps = 36;

            const fieldPointsMaterial = new THREE.PointsMaterial({
                color: colorHexCode,
                size: 0.036,
                transparent: true,
                opacity: 0.78,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const pointsGeometry = new THREE.BufferGeometry();
            const positionsBufferList = [];
            const parametricPointsMetaList = [];

            for (let u = 0; u <= structuralU_Steps; u++) {
                const phiAngle = (u / structuralU_Steps) * Math.PI * 2; // Coplanar orientation sweep
                for (let v = 0; v <= structuralV_Steps; v++) {
                    const thetaAngle = (v / structuralV_Steps) * Math.PI * 2; // Core internal loop rotation

                    // Structural Verification: Standard 3D Parametric Torus Equation Application
                    const coordinatesX = (R_MajorRadius + r_MinorRadius * Math.cos(thetaAngle)) * Math.cos(phiAngle);
                    const coordinatesZ = (R_MajorRadius + r_MinorRadius * Math.cos(thetaAngle)) * Math.sin(phiAngle);
                    const coordinatesY = r_MinorRadius * Math.sin(thetaAngle);

                    positionsBufferList.push(coordinatesX, coordinatesY, coordinatesZ);
                    parametricPointsMetaList.push({ theta: thetaAngle, phi: phiAngle, originalX: coordinatesX, originalY: coordinatesY, originalZ: coordinatesZ });
                }
            }

            pointsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positionsBufferList, 3));
            const toroidalPointCloudMesh = new THREE.Points(pointsGeometry, fieldPointsMaterial);
            torusWrapperGroup.add(toroidalPointCloudMesh);

            return {
                meshWrapper: torusWrapperGroup,
                geometryBlock: pointsGeometry,
                metadata: parametricPointsMetaList,
                majorAxisVal: R_MajorRadius,
                minorAxisVal: r_MinorRadius
            };
        }

        const humanToroidalFieldA = generateParametricVectorToroid(0x00ffcc);
        const humanToroidalFieldB = generateParametricVectorToroid(0xff00aa);
        scene.add(humanToroidalFieldA.meshWrapper);
        scene.add(humanToroidalFieldB.meshWrapper);

        // --- 7. EXTENDED CUSTOM VERTEX-FRAGMENT WEBGL CYMATIC SHADER IMMERSION ENGINE ---
        // Shared global uniform bindings
        const spatialShaderUniforms = {
            uTime: { value: 0.0 },
            uFrequency: { value: 528.0 },
            uVelocity: { value: 343.0 },
            uDamping: { value: 0.4 },
            uAbsorption: { value: 0.35 },
            uBackgroundNoise: { value: 0.15 },
            uColor1: { value: new THREE.Color(0x00ffcc) },
            uColor2: { value: new THREE.Color(0xff00aa) }
        };

        // Create explicit tracking buffers to push coordinate state tracking safely down into pipeline contexts
        const planeGridMeshVertexCount = 140;
        const cymaticPlaneGeometry = new THREE.PlaneGeometry(45, 45, planeGridMeshVertexCount, planeGridMeshVertexCount);
        
        const attributeMatrixOffset1 = new Float32Array(cymaticPlaneGeometry.attributes.position.count);
        const attributeMatrixOffset2 = new Float32Array(cymaticPlaneGeometry.attributes.position.count);
        const attributeMatrixOffset3 = new Float32Array(cymaticPlaneGeometry.attributes.position.count);
        const attributeMatrixOffset4 = new Float32Array(cymaticPlaneGeometry.attributes.position.count);

        cymaticPlaneGeometry.setAttribute('attributeMatrixOffset1', new THREE.BufferAttribute(attributeMatrixOffset1, 1));
        cymaticPlaneGeometry.setAttribute('attributeMatrixOffset2', new THREE.BufferAttribute(attributeMatrixOffset2, 1));
        cymaticPlaneGeometry.setAttribute('attributeMatrixOffset3', new THREE.BufferAttribute(attributeMatrixOffset3, 1));
        cymaticPlaneGeometry.setAttribute('attributeMatrixOffset4', new THREE.BufferAttribute(attributeMatrixOffset4, 1));

        const customChladniBackgroundShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: spatialShaderUniforms,
            transparent: true,
            wireframe: true,
            depthWrite: false
        });

        const chladniCymaticFieldMesh = new THREE.Mesh(cymaticPlaneGeometry, customChladniBackgroundShaderMaterial);
        chladniCymaticFieldMesh.rotation.x = -Math.PI / 2;
        chladniCymaticFieldMesh.position.y = 0.0;
        scene.add(chladniCymaticFieldMesh);

        // --- 8. QUANTUM RUNTIME DISPATCH & STATE MANAGEMENT SYNC ---
        function executeSystemStateSynchronization() {
            const environmentalVelocity = state.envelope.velocity;
            const liveWavelengthValue = environmentalVelocity / state.frequency;
            
            // Text Readout Field Synchronization
            document.getElementById('read-env').textContent = state.envelope.name.split(' (')[0];
            document.getElementById('read-wave').textContent = liveWavelengthValue.toFixed(4) + " m";
            
            // Recalculate physical positional markers across anatomical axis limits
            biologicalHumanA.position.x = (-state.distance / 2) + state.humanOffset.x;
            biologicalHumanA.position.z = state.humanOffset.y;
            
            biologicalHumanB.position.x = (state.distance / 2) + state.humanOffset.x;
            biologicalHumanB.position.z = state.humanOffset.y;
            
            // Map Toroidal Field Centers strictly to heart/torso junctions (Y = 2.78)
            humanToroidalFieldA.meshWrapper.position.set(biologicalHumanA.position.x, 2.78, biologicalHumanA.position.z);
            humanToroidalFieldB.meshWrapper.position.set(biologicalHumanB.position.x, 2.78, biologicalHumanB.position.z);

            // Push positional states directly into the custom shader vertex attributes arrays
            const posAttrA1 = cymaticPlaneGeometry.attributes.attributeMatrixOffset1.array;
            const posAttrA2 = cymaticPlaneGeometry.attributes.attributeMatrixOffset2.array;
            const posAttrB1 = cymaticPlaneGeometry.attributes.attributeMatrixOffset3.array;
            const posAttrB2 = cymaticPlaneGeometry.attributes.attributeMatrixOffset4.array;

            for(let idx = 0; idx < cymaticPlaneGeometry.attributes.position.count; idx++){
                posAttrA1[idx] = biologicalHumanA.position.x;
                posAttrA2[idx] = biologicalHumanA.position.z;
                posAttrB1[idx] = biologicalHumanB.position.x;
                posAttrB2[idx] = biologicalHumanB.position.z;
            }
            cymaticPlaneGeometry.attributes.attributeMatrixOffset1.needsUpdate = true;
            cymaticPlaneGeometry.attributes.attributeMatrixOffset2.needsUpdate = true;
            cymaticPlaneGeometry.attributes.attributeMatrixOffset3.needsUpdate = true;
            cymaticPlaneGeometry.attributes.attributeMatrixOffset4.needsUpdate = true;

            // Synchronize system properties inside uniform shader parameters blocks
            spatialShaderUniforms.uFrequency.value = state.frequency;
            spatialShaderUniforms.uVelocity.value = environmentalVelocity;
            spatialShaderUniforms.uDamping.value = state.envelope.damping;
            spatialShaderUniforms.uAbsorption.value = state.envelope.absorption;
            spatialShaderUniforms.uBackgroundNoise.value = state.envelope.backgroundNoise;

            // Interpersonal Shared States Feedback Logic Matrix
            const calculatedPhaseConvergenceIndex = Math.abs(Math.sin(state.distance * (Math.PI / (liveWavelengthValue || 1.0))));
            const phasePillUIElement = document.getElementById('read-phase');
            
            if (calculatedPhaseConvergenceIndex > 0.72) {
                phasePillUIElement.textContent = "CONSTRUCTIVE INTERFERENCE PATTERN";
                phasePillUIElement.style.backgroundColor = "rgba(0, 255, 204, 0.25)";
                phasePillUIElement.style.color = "#00ffcc";
            } else if (calculatedPhaseConvergenceIndex < 0.28) {
                phasePillUIElement.textContent = "DESTRUCTIVE RECOMBINATION CANCELLATION";
                phasePillUIElement.style.backgroundColor = "rgba(255, 0, 170, 0.25)";
                phasePillUIElement.style.color = "#ff00aa";
            } else {
                phasePillUIElement.textContent = "COMPLEX PROBABILISTIC INTERACTION";
                phasePillUIElement.style.backgroundColor = "rgba(240, 200, 40, 0.25)";
                phasePillUIElement.style.color = "#f0c828";
            }

            syncSynthesizerOutputs();
        }

        // --- 9. INTERACTIVE INTERFACE LINK CHANNELS CONTROLS ---
        document.getElementById('manual-freq').addEventListener('input', function(ev) {
            let inputNumericValue = parseFloat(ev.target.value);
            if (isNaN(inputNumericValue) || inputNumericValue <= 0.0) inputNumericValue = 0.1;
            state.frequency = inputNumericValue;
            executeSystemStateSynchronization();
            wakeUI();
        });

        document.getElementById('space-envelope').addEventListener('change', function(ev) {
            state.envelope = collectiveEnvelopes.find(e => e.id === ev.target.value);
            executeSystemStateSynchronization();
            wakeUI();
        });

        document.getElementById('interpersonal-dist').addEventListener('input', function(ev) {
            state.distance = parseFloat(ev.target.value);
            executeSystemStateSynchronization();
            wakeUI();
        });

        // --- 10. INTERACTIVE PORTABLE TRACKTOUCH GESTURE SYSTEM CHANNELS ---
        function touchControlStartInterceptor(clientX, clientY) {
            state.pointerDown = true;
            state.pointerStartPos.x = clientX;
            state.pointerStartPos.y = clientY;
            wakeUI();
        }

        function touchControlMovementProcessor(clientX, clientY) {
            if (!state.pointerDown) return;
            
            const positionDifferentialDeltaX = (clientX - state.pointerStartPos.x) * 0.016;
            const positionDifferentialDeltaY = (clientY - state.pointerStartPos.y) * 0.016;
            
            state.humanOffset.x += positionDifferentialDeltaX;
            state.humanOffset.y += positionDifferentialDeltaY;
            
            state.pointerStartPos.x = clientX;
            state.pointerStartPos.y = clientY;
            
            executeSystemStateSynchronization();
            wakeUI();
        }

        window.addEventListener('mousedown', function(e) {
            if (e.target.closest('#control-panel')) return;
            touchControlStartInterceptor(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', function(e) {
            touchControlMovementProcessor(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', function() {
            state.pointerDown = false;
        });

        window.addEventListener('touchstart', function(e) {
            if (e.target.closest('#control-panel')) return;
            const touchInstance = e.touches[0];
            touchControlStartInterceptor(touchInstance.clientX, touchInstance.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
            const touchInstance = e.touches[0];
            touchControlMovementProcessor(touchInstance.clientX, touchInstance.clientY);
        }, { passive: true });

        window.addEventListener('touchend', function() {
            state.pointerDown = false;
        });

        // --- 11. AUTO-FADING DASHBOARD DESIGN CONTEXTS ---
        const uiContainerLayerElement = document.getElementById('ui-layer');

        function wakeUI() {
            uiContainerLayerElement.style.opacity = "1.0";
            clearTimeout(state.uiTimeoutId);
            state.uiTimeoutId = setTimeout(function() {
                if (!state.pointerDown && state.audioEnabled) {
                    uiContainerLayerElement.style.opacity = "0.08";
                }
            }, 6000);
        }

        // --- 12. RUNTIME SIMULATION MAIN RECURSION LOOPS ---
        const operationClockInstance = new THREE.Clock();

        function mainSimulationProcessingLoop() {
            requestAnimationFrame(mainSimulationProcessingLoop);

            const internalDeltaTime = operationClockInstance.getDelta();
            
            // Map global loop execution velocity scaling limits inline with tracker states
            state.time += internalDeltaTime * (state.frequency * 0.012);
            spatialShaderUniforms.uTime.value = state.time * 0.08;

            // Realtime 3D Parametric Deformation Loop over Toroidal Field Vectors
            [
                { toroidalTarget: humanToroidalFieldA, trackingPolarity: 1.0 },
                { toroidalTarget: humanToroidalFieldB, trackingPolarity: -1.0 }
            ].forEach(executionConfig => {
                const dynamicPositionBufferAttribute = executionConfig.toroidalTarget.geometryBlock.attributes.position;
                const activePointsPositionsArray = dynamicPositionBufferAttribute.array;
                
                for (let i = 0; i < executionConfig.toroidalTarget.metadata.length; i++) {
                    const pointMetadata = executionConfig.toroidalTarget.metadata[i];

                    // Map modifications using the environmental state variables array variables
                    const parametricOscillatoryWaveFactor = Math.sin(pointMetadata.theta * 3.0 + state.time * 0.75) * (0.09 * (1.0 - state.envelope.absorption));
                    const boundaryMediumCompressionFactor = Math.cos(pointMetadata.phi * 2.0 - state.time * 0.35) * (0.06 * state.envelope.damping);

                    const transformedMajorRadius = executionConfig.toroidalTarget.majorAxisVal + parametricOscillatoryWaveFactor;
                    const transformedMinorRadius = executionConfig.toroidalTarget.minorAxisVal + boundaryMediumCompressionFactor;

                    // Compute dynamic transformation matrix locations alongside exact parametric equation mappings
                    activePointsPositionsArray[i * 3]     = (transformedMajorRadius + transformedMinorRadius * Math.cos(pointMetadata.theta)) * Math.cos(pointMetadata.phi + state.time * 0.008 * executionConfig.trackingPolarity);
                    activePointsPositionsArray[i * 3 + 1] = transformedMinorRadius * Math.sin(pointMetadata.theta);
                    activePointsPositionsArray[i * 3 + 2] = (transformedMajorRadius + transformedMinorRadius * Math.cos(pointMetadata.theta)) * Math.sin(pointMetadata.phi + state.time * 0.008 * executionConfig.trackingPolarity);
                }
                dynamicPositionBufferAttribute.needsUpdate = true;
                executionConfig.toroidalTarget.meshWrapper.rotation.y += 0.0035 * executionConfig.trackingPolarity;
            });

            // Gentle responsive camera panning transitions to enhance immersion depths
            camera.position.x = Math.sin(state.time * 0.004) * 0.8 + state.humanOffset.x;
            camera.lookAt(state.humanOffset.x, 2.6, state.humanOffset.y);

            renderer.render(scene, camera);
        }

        // Viewport aspect alignment mechanics safely targeting cross-platform engines
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize spatial configuration baselines and boot production tracks loop
        executeSystemStateSynchronization();
        wakeUI();
        mainSimulationProcessingLoop();
    </script>
</body>
</html>

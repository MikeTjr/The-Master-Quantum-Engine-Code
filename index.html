<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Bio-Resonance & Cymatic Interaction Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #e0e6ed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* UI Control Panel */
        #control-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 18px;
            width: 340px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            color: #00ffcc;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 6px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #8a99ad;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="number"], input[type="range"] {
            width: 100%;
            background: #121824;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #00ffcc;
        }
        .frequency-input-wrapper {
            display: flex;
            gap: 10px;
        }
        .frequency-input-wrapper input[type="number"] {
            flex: 1;
        }
        .unit-label {
            background: #182235;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00ffcc;
        }
        /* Dashboard Readouts */
        #data-readout {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
            font-size: 0.75rem;
            color: #a0aec0;
        }
        .readout-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .readout-val {
            color: #00ffcc;
        }
        /* Status indicator */
        .status-pill {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
        }
        /* Optimization for mobile touch targets */
        @media (max-width: 480px) {
            #control-panel {
                width: calc(100% - 30px);
                max-height: 45vh;
                top: auto;
                bottom: 15px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="control-panel">
        <h1>Vibrational Resonance Engine</h1>
        
        <div class="control-group">
            <label for="manual-freq">Manual Frequency Input</label>
            <div class="frequency-input-wrapper">
                <input type="number" id="manual-freq" value="528" min="1" max="20000" step="0.1">
                <span class="unit-label">Hz</span>
            </div>
        </div>

        <div class="control-group">
            <label for="space-envelope">Collective Space Envelope</label>
            <select id="space-envelope">
                </select>
        </div>

        <div class="control-group">
            <label for="human-distance">Interpersonal Distance</label>
            <input type="range" id="human-distance" min="1.0" max="15.0" step="0.1" value="4.5">
        </div>

        <div id="data-readout">
            <div class="readout-line"><span>State Configuration:</span><span id="readout-envelope" class="readout-val">-</span></div>
            <div class="readout-line"><span>Wavelength ($\lambda$):</span><span id="readout-wavelength" class="readout-val">-</span></div>
            <div class="readout-line"><span>Field Alignment Status:</span><span id="readout-coherence" class="status-pill">COHERENT</span></div>
        </div>
    </div>

    <script>
        // --- 1. THE 50 COLLECTIVE SPACE ENVELOPES DATABASE ---
        const collectiveEnvelopes = [
            // Architectural & Enclosed Spaces (1-15)
            { id: "env_01", name: "01. Standard Living Room (Muffled resonance)", damping: 0.4, velocity: 343, backgroundNoise: 0.15, absorption: 0.35 },
            { id: "env_02", name: "02. Concrete Recording Studio (High dampening)", damping: 0.1, velocity: 340, backgroundNoise: 0.02, absorption: 0.85 },
            { id: "env_03", name: "03. Cathedral/Sanctuary (Massive echo, high ceiling)", damping: 0.9, velocity: 346, backgroundNoise: 0.10, absorption: 0.12 },
            { id: "env_04", name: "04. Academic Lecture Hall", damping: 0.5, velocity: 343, backgroundNoise: 0.22, absorption: 0.40 },
            { id: "env_05", name: "05. Crowded Coffee Shop (High chaotic noise floor)", damping: 0.6, velocity: 342, backgroundNoise: 0.65, absorption: 0.50 },
            { id: "env_06", name: "06. Elevators (Extreme spatial compression)", damping: 0.2, velocity: 344, backgroundNoise: 0.30, absorption: 0.20 },
            { id: "env_07", name: "07. Industrial Warehouse", damping: 0.8, velocity: 345, backgroundNoise: 0.40, absorption: 0.15 },
            { id: "env_08", name: "08. Subterranean Concrete Bunker", damping: 0.85, velocity: 341, backgroundNoise: 0.05, absorption: 0.08 },
            { id: "env_09", name: "09. Glass Greenhouse (High reflection)", damping: 0.75, velocity: 347, backgroundNoise: 0.25, absorption: 0.10 },
            { id: "env_10", name: "10. Open Office Bullpen", damping: 0.45, velocity: 343, backgroundNoise: 0.55, absorption: 0.45 },
            { id: "env_11", name: "11. Confessional Booth", damping: 0.15, velocity: 342, backgroundNoise: 0.01, absorption: 0.75 },
            { id: "env_12", name: "12. Hospital Operating Room (Sterile, flat)", damping: 0.3, velocity: 343, backgroundNoise: 0.28, absorption: 0.30 },
            { id: "env_13", name: "13. Hardwood Dance Studio", damping: 0.65, velocity: 344, backgroundNoise: 0.20, absorption: 0.25 },
            { id: "env_14", name: "14. Vaulted Library (Absorptive dead space)", damping: 0.2, velocity: 342, backgroundNoise: 0.08, absorption: 0.80 },
            { id: "env_15", name: "15. Underground Subway Station", damping: 0.92, velocity: 344, backgroundNoise: 0.70, absorption: 0.05 },
            
            // Natural & Open-Air Environments (16-30)
            { id: "env_16", name: "16. Dense Pine Forest (Organic scattering)", damping: 0.35, velocity: 338, backgroundNoise: 0.18, absorption: 0.65 },
            { id: "env_17", name: "17. Open Desert Plain (Zero reflection)", damping: 0.05, velocity: 350, backgroundNoise: 0.12, absorption: 0.98 },
            { id: "env_18", name: "18. High Mountain Peak (Low density, rapid decay)", damping: 0.02, velocity: 320, backgroundNoise: 0.25, absorption: 0.99 },
            { id: "env_19", name: "19. Ocean Shoreline (Constant white-noise)", damping: 0.5, velocity: 345, backgroundNoise: 0.80, absorption: 0.40 },
            { id: "env_20", name: "20. Still Lakeside (High ground reflection)", damping: 0.7, velocity: 344, backgroundNoise: 0.10, absorption: 0.20 },
            { id: "env_21", name: "21. Sub-Zero Arctic Tundra", damping: 0.1, velocity: 315, backgroundNoise: 0.08, absorption: 0.90 },
            { id: "env_22", name: "22. Underground Cavern/Cave System", damping: 0.88, velocity: 342, backgroundNoise: 0.04, absorption: 0.07 },
            { id: "env_23", name: "23. Open Meadow/Grassland", damping: 0.12, velocity: 343, backgroundNoise: 0.20, absorption: 0.85 },
            { id: "env_24", name: "24. Deep Jungle Canopy", damping: 0.4, velocity: 346, backgroundNoise: 0.60, absorption: 0.70 },
            { id: "env_25", name: "25. Urban Street Canyon (Brick/asphalt)", damping: 0.78, velocity: 344, backgroundNoise: 0.62, absorption: 0.18 },
            { id: "env_26", name: "26. Cornfield Maze (High absorption)", damping: 0.22, velocity: 342, backgroundNoise: 0.15, absorption: 0.78 },
            { id: "env_27", name: "27. Rocky Gorge/Canyon", damping: 0.82, velocity: 345, backgroundNoise: 0.11, absorption: 0.14 },
            { id: "env_28", name: "28. Misty Valley/Fog Field", damping: 0.48, velocity: 340, backgroundNoise: 0.09, absorption: 0.55 },
            { id: "env_29", name: "29. Desert Oasis", damping: 0.3, velocity: 348, backgroundNoise: 0.35, absorption: 0.50 },
            { id: "env_30", name: "30. Coastal Cliffside", damping: 0.42, velocity: 346, backgroundNoise: 0.72, absorption: 0.45 },
            
            // Psychological & Interpersonal States (31-43)
            { id: "env_31", name: "31. Intimate Proximity (0-18 in, field fusion)", damping: 0.25, velocity: 343, backgroundNoise: 0.05, absorption: 0.60 },
            { id: "env_32", name: "32. Personal Distance (1.5-4 ft, overlap)", damping: 0.4, velocity: 343, backgroundNoise: 0.12, absorption: 0.45 },
            { id: "env_33", name: "33. Social Dialogue Circle (4-12 ft)", damping: 0.5, velocity: 343, backgroundNoise: 0.25, absorption: 0.35 },
            { id: "env_34", name: "34. Public Presentation Stage", damping: 0.6, velocity: 344, backgroundNoise: 0.38, absorption: 0.30 },
            { id: "env_35", name: "35. Adversarial Face-off (Tense friction)", damping: 0.95, velocity: 341, backgroundNoise: 0.50, absorption: 0.10 },
            { id: "env_36", name: "36. Synchronized Performance (Alignment)", damping: 0.15, velocity: 344, backgroundNoise: 0.08, absorption: 0.70 },
            { id: "env_37", name: "37. Meditative Group Circle (Harmonic lock)", damping: 0.05, velocity: 343, backgroundNoise: 0.02, absorption: 0.92 },
            { id: "env_38", name: "38. Chaotic Riot/Mob Dynamics", damping: 0.99, velocity: 345, backgroundNoise: 0.95, absorption: 0.05 },
            { id: "env_39", name: "39. Mother-Infant Bonding Field", damping: 0.08, velocity: 342, backgroundNoise: 0.04, absorption: 0.88 },
            { id: "env_40", name: "40. Shared Grief Room (Heavy resonance)", damping: 0.35, velocity: 339, backgroundNoise: 0.06, absorption: 0.75 },
            { id: "env_41", name: "41. Celebration Floor (High-amp coherence)", damping: 0.85, velocity: 346, backgroundNoise: 0.88, absorption: 0.20 },
            { id: "env_42", name: "42. Silent Commute (Suppressed/isolated)", damping: 0.2, velocity: 343, backgroundNoise: 0.45, absorption: 0.65 },
            { id: "env_43", name: "43. Therapeutic Session Space", damping: 0.3, velocity: 342, backgroundNoise: 0.03, absorption: 0.55 },
            
            // Quantum & Theoretical Fields (44-50)
            { id: "env_44", name: "44. Absolute Zero Vacuum (Pure wave)", damping: 0.0, velocity: 300, backgroundNoise: 0.00, absorption: 1.00 },
            { id: "env_45", name: "45. Hyperbaric Chamber (High-density pressure)", damping: 0.7, velocity: 368, backgroundNoise: 0.40, absorption: 0.30 },
            { id: "env_46", name: "46. Electromagnetic Shielded Cage (Faraday)", damping: 0.1, velocity: 343, backgroundNoise: 0.01, absorption: 0.95 },
            { id: "env_47", name: "47. Schumann Resonance Matrix (7.83 Hz)", damping: 0.05, velocity: 343, backgroundNoise: 0.07, absorption: 0.90 },
            { id: "env_48", name: "48. Fluid Dynamic Superfluid Medium", damping: 0.02, velocity: 450, backgroundNoise: 0.05, absorption: 0.97 },
            { id: "env_49", name: "49. High-Gravity Core (Compressed torus)", damping: 0.9, velocity: 220, backgroundNoise: 0.60, absorption: 0.05 },
            { id: "env_50", name: "50. Tachyon Theoretical Field (Inverse phase)", damping: 0.1, velocity: 999, backgroundNoise: 0.10, absorption: 0.50 }
        ];

        // --- 2. SETUP APPLICATION STATE ---
        const state = {
            frequency: 528,
            envelope: collectiveEnvelopes[0],
            distance: 4.5,
            time: 0
        };

        // Populate HTML Dropdown Option Elements
        const selectElement = document.getElementById('space-envelope');
        collectiveEnvelopes.forEach(env => {
            const opt = document.createElement('option');
            opt.value = env.id;
            opt.textContent = env.name;
            selectElement.appendChild(opt);
        });

        // --- 3. RE-ENGINEER THREE.JS VISUAL ENGINE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Ambient Background Lighting
        const ambientLight = new THREE.AmbientLight(0x0a0f1d);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0x00ffcc, 1.5);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // --- 4. EXPERT ANATOMICAL HUMAN MESH OVERHAUL ---
        // Replacing stick-figures with college-level academic proportions
        function createAnatomicalHumanSilhouette() {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a1528,
                wireframe: true,
                transparent: true,
                opacity: 0.65,
                roughness: 0.2,
                metalness: 0.8
            });

            // Head/Cranium (Academic scale: ~1/8th total body height)
            const headGeo = new THREE.SphereGeometry(0.32, 16, 16);
            headGeo.scale(1, 1.25, 1);
            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 3.9;
            group.add(head);

            // Neck
            const neckGeo = new THREE.CylinderGeometry(0.12, 0.16, 0.25, 12);
            const neck = new THREE.Mesh(neckGeo, material);
            neck.position.y = 3.45;
            group.add(neck);

            // Torso / Ribcage Core
            const torsoGeo = new THREE.CylinderGeometry(0.5, 0.35, 1.3, 16);
            torsoGeo.scale(1.2, 1, 0.7); // Flatten chest depth coordinate
            const torso = new THREE.Mesh(torsoGeo, material);
            torso.position.y = 2.7;
            group.add(torso);

            // Pelvic Girdle Base
            const pelvisGeo = new THREE.CylinderGeometry(0.36, 0.42, 0.5, 16);
            pelvisGeo.scale(1.1, 1, 0.8);
            const pelvis = new THREE.Mesh(pelvisGeo, material);
            pelvis.position.y = 1.9;
            group.add(pelvis);

            // Left & Right Arms
            const armGeo = new THREE.CylinderGeometry(0.12, 0.08, 1.4, 12);
            const leftArm = new THREE.Mesh(armGeo, material);
            leftArm.position.set(-0.75, 2.7, 0);
            leftArm.rotation.z = 0.12;
            group.add(leftArm);

            const rightArm = leftArm.clone();
            rightArm.position.x = 0.75;
            rightArm.rotation.z = -0.12;
            group.add(rightArm);

            // Left & Right Legs
            const legGeo = new THREE.CylinderGeometry(0.18, 0.11, 1.8, 12);
            const leftLeg = new THREE.Mesh(legGeo, material);
            leftLeg.position.set(-0.32, 0.9, 0);
            group.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.32;
            group.add(rightLeg);

            return group;
        }

        // Generate Two Interacting Humans
        const human1 = createAnatomicalHumanSilhouette();
        const human2 = createAnatomicalHumanSilhouette();
        scene.add(human1);
        scene.add(human2);

        // --- 5. MATHEMATICAL TOROIDAL SYSTEM DEFINITION ---
        // Generates explicit 3D torus paths utilizing true parametric equations
        function createParametricToroidField(tubeColor) {
            const group = new THREE.Group();
            
            const R = 2.4; // Major Radius
            const r = 1.2; // Minor Radius
            const uSegments = 40; 
            const vSegments = 24;

            const dotMaterial = new THREE.PointsMaterial({
                color: tubeColor,
                size: 0.035,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const initialCoords = []; // Save pristine states for structural oscillation loops

            for (let i = 0; i <= uSegments; i++) {
                const phi = (i / uSegments) * Math.PI * 2; // Major rotation axis angle
                for (let j = 0; j <= vSegments; j++) {
                    const theta = (j / vSegments) * Math.PI * 2; // Minor rotation tube angle

                    // True Parametric Equations of a Torus
                    const x = (R + r * Math.cos(theta)) * Math.cos(phi);
                    const z = (R + r * Math.cos(theta)) * Math.sin(phi);
                    const y = r * Math.sin(theta);

                    positions.push(x, y, z);
                    initialCoords.push({x, y, z, theta, phi});
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const pointCloud = new THREE.Points(geometry, dotMaterial);
            group.add(pointCloud);

            return { group, geometry, initialCoords, R, r };
        }

        const torus1 = createParametricToroidField(0x00ffcc);
        const torus2 = createParametricToroidField(0xff00aa);
        scene.add(torus1.group);
        scene.add(torus2.group);

        // --- 6. BACKGROUND SEAMLESS CYMATIC WAVE MATRIX ---
        const gridSegments = 80;
        const gridGeo = new THREE.PlaneGeometry(35, 35, gridSegments, gridSegments);
        gridGeo.rotateX(-Math.PI / 2); // Set flat coordinate space baseline

        const gridMat = new THREE.MeshStandardMaterial({
            color: 0x111c30,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const waveGrid = new THREE.Mesh(gridGeo, gridMat);
        waveGrid.position.y = -0.1;
        scene.add(waveGrid);

        const initialGridPositions = [...gridGeo.attributes.position.array];

        // --- 7. LIVE UI UPDATE PIPELINE & CONTROL COUPLING ---
        function updateEngineMetrics() {
            const wavelength = state.envelope.velocity / state.frequency;
            
            document.getElementById('readout-envelope').textContent = state.envelope.name.split(' (')[0];
            document.getElementById('readout-wavelength').textContent = wavelength.toFixed(3) + " m";
            
            // Reposition the structural coordinates based on spacing criteria
            human1.position.x = -state.distance / 2;
            human2.position.x = state.distance / 2;
            
            // Heart-source mapping coordinates for energy field origins
            torus1.group.position.set(human1.position.x, 2.7, 0);
            torus2.group.position.set(human2.position.x, 2.7, 0);

            // Dynamically recalculate phase coherence status
            const phaseCoherence = Math.abs(Math.sin(state.distance * (Math.PI / (wavelength || 1))));
            const pill = document.getElementById('readout-coherence');
            if(phaseCoherence > 0.7) {
                pill.textContent = "CONSTRUCTIVE";
                pill.style.background = "rgba(0, 255, 204, 0.2)";
                pill.style.color = "#00ffcc";
            } else if(phaseCoherence < 0.3) {
                pill.textContent = "DESTRUCTIVE";
                pill.style.background = "rgba(255, 0, 170, 0.2)";
                pill.style.color = "#ff00aa";
            } else {
                pill.textContent = "COMPLEX OVERLAP";
                pill.style.background = "rgba(235, 210, 50, 0.2)";
                pill.style.color = "#ebd232";
            }
        }

        // Event Handling Triggers
        document.getElementById('manual-freq').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val) || val <= 0) val = 1;
            state.frequency = val;
            updateEngineMetrics();
        });

        document.getElementById('space-envelope').addEventListener('change', (e) => {
            state.envelope = collectiveEnvelopes.find(env => env.id === e.target.value);
            updateEngineMetrics();
        });

        document.getElementById('human-distance').addEventListener('input', (e) => {
            state.distance = parseFloat(e.target.value);
            updateEngineMetrics();
        });

        // Initialize display values
        updateEngineMetrics();

        // --- 8. REAL-TIME MATHEMATICAL SIMULATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            state.time += delta * (state.frequency * 0.02); // Frequency drives timeline speed directly

            const waveSpeed = state.frequency * 0.005;
            const currentWavelength = state.envelope.velocity / state.frequency;

            // Animate Parametric Toroidal Arrays
            [torus1, torus2].forEach((torusInstance, tIdx) => {
                const posAttr = torusInstance.geometry.attributes.position;
                const arr = posAttr.array;
                const sign = tIdx === 0 ? 1 : -1;

                for (let idx = 0; idx < torusInstance.initialCoords.length; idx++) {
                    const orig = torusInstance.initialCoords[idx];
                    
                    // Incorporating structural environment parameters into the geometric vectors
                    const physicalOscillation = Math.sin(orig.theta * 4 + state.time) * (0.06 * (1 - state.envelope.absorption));
                    const environmentCompression = Math.cos(orig.phi * 2 - state.time * 0.5) * (0.04 * state.envelope.damping);
                    
                    const dynamicR = torusInstance.R + physicalOscillation;
                    const dynamicR_minor = torusInstance.r + environmentCompression;

                    // Compute dynamic transformation states across axes
                    arr[idx * 3]     = (dynamicR + dynamicR_minor * Math.cos(orig.theta)) * Math.cos(orig.phi + state.time * 0.02 * sign);
                    arr[idx * 3 + 1] = dynamicR_minor * Math.sin(orig.theta);
                    arr[idx * 3 + 2] = (dynamicR + dynamicR_minor * Math.cos(orig.theta)) * Math.sin(orig.phi + state.time * 0.02 * sign);
                }
                posAttr.needsUpdate = true;
                torusInstance.group.rotation.y += 0.003 * sign;
            });

            // Animate Ambient Background Cymatic Grid Surfaces
            const gridPosAttr = waveGrid.geometry.attributes.position;
            const gridArr = gridPosAttr.array;

            for (let i = 0; i < gridArr.length / 3; i++) {
                const origX = initialGridPositions[i * 3];
                const origZ = initialGridPositions[i * 3 + 2];

                // Distance functions mapping core human source emission roots
                const distToH1 = Math.sqrt(Math.pow(origX - human1.position.x, 2) + Math.pow(origZ, 2));
                const distToH2 = Math.sqrt(Math.pow(origX - human2.position.x, 2) + Math.pow(origZ, 2));

                // Wave functions calculating spatial propagation metrics
                const wave1 = Math.sin(distToH1 / (currentWavelength * 0.2) - state.time) * (0.4 / (distToH1 + 1));
                const wave2 = Math.sin(distToH2 / (currentWavelength * 0.2) - state.time) * (0.4 / (distToH2 + 1));

                // Interpersonal shared states mapping wave superposition
                let sharedStateInterference = wave1 + wave2;

                // Inject environmental background noise profiles
                sharedStateInterference += (Math.sin(origX * 2 + state.time) * Math.cos(origZ * 2 + state.time)) * (0.05 * state.envelope.backgroundNoise);

                // Apply structural attenuation modifiers
                gridArr[i * 3 + 1] = sharedStateInterference * (1.0 - state.envelope.absorption);
            }
            gridPosAttr.needsUpdate = true;

            // Slow camera drift to preserve immersion depth
            camera.position.x = Math.sin(state.time * 0.01) * 0.5;

            renderer.render(scene, camera);
        }

        // Handle Responsive Viewport Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Fire rendering loop
        animate();
    </script>
</body>
</html>

                photonWidth: "99%",

        // --- Core Application State Controls ---
        let appState = {
            activeKey: "torus-default",
            phaseState: "before", 
            amplifierActive: false,
            proximityCount: 1, 
            timeVector: 0
        };

        // --- High-Fidelity Physics Engine ---
        const canvas = document.getElementById('quantum-stage');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const baseParticleCount = 3000;

        function initParticleCloud() {
            particles = [];
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            for (let i = 0; i < baseParticleCount; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: 0,
                    vy: 0,
                    alpha: Math.random() * 0.4 + 0.15,
                    size: Math.random() * 1.1 + 0.3
                });
            }
        }

        function resizeStage() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            initParticleCloud();
        }

        // --- Geometric Engine: Human Form & Toroidal Field Networks ---
        function drawToroidalIndividual(ctx, cx, cy, scaleSize, currentCoherence, activeColor) {
            ctx.save();

            // 1. Core Figure Framework Vector Coordinates
            ctx.lineWidth = 1.2;
            if (currentCoherence < 0.4) {
                ctx.strokeStyle = 'rgba(255, 0, 85, 0.12)';
                ctx.fillStyle = 'rgba(255, 0, 85, 0.05)';
                ctx.beginPath();
                ctx.arc(cx, cy - scaleSize * 0.3, scaleSize * 0.05, 0, Math.PI * 2);
                ctx.moveTo(cx, cy - scaleSize * 0.25);
                ctx.lineTo(cx - scaleSize * 0.08, cy);
                ctx.moveTo(cx, cy - scaleSize * 0.25);
                ctx.lineTo(cx + scaleSize * 0.08, cy);
                ctx.stroke();
            } else {
                ctx.strokeStyle = appState.amplifierActive ? 'rgba(212, 175, 55, 0.3)' : 'rgba(255, 255, 255, 0.18)';
                ctx.beginPath();
                ctx.arc(cx, cy - scaleSize * 0.3, scaleSize * 0.05, 0, Math.PI * 2); 
                ctx.moveTo(cx, cy - scaleSize * 0.25);
                ctx.lineTo(cx, cy + scaleSize * 0.1); 
                ctx.moveTo(cx, cy - scaleSize * 0.18);
                ctx.lineTo(cx - scaleSize * 0.1, cy - scaleSize * 0.1);
                ctx.moveTo(cx, cy - scaleSize * 0.18);
                ctx.lineTo(cx + scaleSize * 0.1, cy - scaleSize * 0.1);
                ctx.moveTo(cx, cy + scaleSize * 0.1);
                ctx.lineTo(cx - scaleSize * 0.06, cy + scaleSize * 0.35);
                ctx.moveTo(cx, cy + scaleSize * 0.1);
                ctx.lineTo(cx + scaleSize * 0.06, cy + scaleSize * 0.35);
                ctx.stroke();

                // Heart Center Point (The Core Origin)
                ctx.beginPath();
                ctx.arc(cx, cy - scaleSize * 0.15, 4, 0, Math.PI * 2);
                ctx.fillStyle = activeColor;
                ctx.fill();
            }

            // 2. Multidimensional Heart Torus Lattice Ring Construction
            const ringCount = 8;
            for (let i = 0; i < ringCount; i++) {
                let flowPhase = (appState.timeVector * 0.5) + (i * Math.PI / ringCount);
                let dynamicWidth = scaleSize * 0.75 * (0.8 + 0.2 * Math.sin(appState.timeVector * 2));
                let dynamicHeight = scaleSize * 0.45 * (0.8 + 0.2 * Math.cos(appState.timeVector * 2));

                ctx.lineWidth = 1;
                ctx.strokeStyle = currentCoherence > 0.4
                    ? hexToRgba(activeColor, 0.04 * currentCoherence)
                    : `rgba(255, 0, 85, 0.02)`;

                ctx.beginPath();
                ctx.ellipse(cx, cy - scaleSize * 0.15, dynamicWidth, dynamicHeight, flowPhase, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(cx, cy - scaleSize * 0.15, dynamicWidth * 0.4, dynamicHeight * 1.6, -flowPhase * 0.5, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // --- Universe Loop & Entanglement Engine Pipeline ---
        function runUniversePipeline() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            ctx.fillStyle = 'rgba(2, 3, 5, 0.09)';
            ctx.fillRect(0, 0, w, h);

            appState.timeVector += 0.016;
            
            const currentData = quantumLibrary[appState.activeKey];
            const sizeMetric = Math.min(w, h) * 0.65;

            // Coherence matrix computations
            let coherence = appState.amplifierActive ? 1.0 : currentData.coherence;
            if (appState.phaseState === 'after') coherence = Math.min(1.0, coherence + 0.35);
            if (appState.phaseState === 'before' && coherence > 0.5) coherence *= 0.5;

            // Generate structural anchor coordinate points dynamically based on current slider counts
            let positions = [];
            const yCenter = h / 2 - 30;
            
            if (appState.proximityCount === 1) {
                positions.push({ x: w / 2, y: yCenter, scale: sizeMetric });
            } else if (appState.proximityCount === 2) {
                positions.push({ x: w / 2 - sizeMetric * 0.4, y: yCenter, scale: sizeMetric * 0.85 });
                positions.push({ x: w / 2 + sizeMetric * 0.4, y: yCenter, scale: sizeMetric * 0.85 });
            } else {
                positions.push({ x: w / 2 - sizeMetric * 0.6, y: yCenter, scale: sizeMetric * 0.7 });
                positions.push({ x: w / 2, y: yCenter, scale: sizeMetric * 0.7 });
                positions.push({ x: w / 2 + sizeMetric * 0.6, y: yCenter, scale: sizeMetric * 0.7 });
            }

            // Draw structural centers
            positions.forEach(pos => {
                drawToroidalIndividual(ctx, pos.x, pos.y, pos.scale, coherence, currentData.color);
            });

            // Process mathematical particle dynamics across the unified multi-body space
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                // Track forces from closest heart anchor nodes
                let closestNode = null;
                let minDist = 999999;
                
                positions.forEach(pos => {
                    let heartX = pos.x;
                    let heartY = pos.y - pos.scale * 0.15;
                    let dx = p.x - heartX;
                    let dy = p.y - heartY;
                    let d = Math.sqrt(dx*dx + dy*dy);
                    if (d < minDist) {
                        minDist = d;
                        closestNode = { x: heartX, y: heartY, scale: pos.scale };
                    }
                });

                let dx = p.x - closestNode.x;
                let dy = p.y - closestNode.y;
                let r = Math.sqrt(dx * dx + dy * dy);
                let angle = Math.atan2(dy, dx);

                let freq = currentData.complexity;
                let targetX = p.x;
                let targetY = p.y;

                if (coherence > 0.4) {
                    // Perfect Toroidal Circulation Equations: Clean Expansion and Contraction Loops
                    let loopPulse = Math.sin(r * 0.022 - appState.timeVector * 2.2) * Math.cos(angle * freq);
                    targetX += Math.cos(angle + Math.PI / 2) * loopPulse * 2.0;
                    targetY += Math.sin(angle + Math.PI / 2) * loopPulse * 2.0;
                    
                    // Pull particles gently back through the heart source axis
                    let intakeForce = Math.sin(r * 0.01 - appState.timeVector) * 0.6;
                    targetX -= Math.cos(angle) * intakeForce;
                    targetY -= Math.sin(angle) * intakeForce;
                } else {
                    // Fragmented High-Entropy Jitter Models
                    let chaosPulse = Math.sin(r * 0.08 + appState.timeVector * 8) * Math.sin(angle * 6);
                    targetX += Math.cos(angle) * chaosPulse * 2.8;
                    targetY += Math.sin(angle) * chaosPulse * 2.8;
                }

                // Internal Metal Amplification Calculations
                if (appState.amplifierActive) {
                    let goldWave = Math.cos(r * 0.015 - angle * 2 - appState.timeVector * 1.5);
                    targetX += Math.cos(angle + Math.PI / 4) * goldWave * 2.5;
                    targetY += Math.sin(angle + Math.PI / 4) * goldWave * 2.5;
                }

                // Interpolation and drag execution
                p.vx += (targetX - p.x) * 0.04;
                p.vy += (targetY - p.y) * 0.04;
                p.vx *= 0.82;
                p.vy *= 0.82;

                p.x += p.vx;
                p.y += p.vy;

                // Border overflow recycling parameters
                if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.vx = 0;
                    p.vy = 0;
                }

                // Render individual nodes using calculated weights
                ctx.fillStyle = appState.amplifierActive && Math.random() > 0.4 
                    ? `rgba(212, 175, 55, ${p.alpha * coherence})` 
                    : hexToRgba(currentData.color, p.alpha * coherence);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(runUniversePipeline);
        }

        // --- UI Interactions & State Handlers ---
        function updateUIElements() {
            const data = quantumLibrary[appState.activeKey];
            
            document.getElementById('field-title').innerText = data.name;
            document.getElementById('field-origin').innerText = data.origin;
            document.getElementById('field-desc').innerText = data.desc;
            document.getElementById('field-photon-lbl').innerText = data.photonLbl;
            document.getElementById('field-flow-desc').innerText = data.flowDesc;
            
            const bar = document.getElementById('photon-metric-bar');
            bar.style.width = data.photonWidth;
            bar.style.backgroundColor = data.color;
            bar.style.boxShadow = `0 0 10px ${data.color}`;
        }

        function handleDropdownShift(selectedVal) {
            appState.activeKey = selectedVal;
            updateUIElements();
        }

        function handleProximityShift(val) {
            appState.proximityCount = parseInt(val, 10);
        }

        function togglePhaseState(state) {
            appState.phaseState = state;
            document.getElementById('phase-before').classList.toggle('active', state === 'before');
            document.getElementById('phase-after').classList.toggle('active', state === 'after');
        }

        function toggleCosmicAmplifier() {
            appState.amplifierActive = !appState.amplifierActive;
            document.getElementById('cosmic-amp').classList.toggle('active', appState.amplifierActive);
        }

        // --- Helper Utilities ---
        function hexToRgba(hex, alpha) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `rgba(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}, ${alpha})` : `rgba(255,255,255,${alpha})`;
        }

        // --- Initialization Lifecycle ---
        window.addEventListener('resize', resizeStage);
        window.addEventListener('DOMContentLoaded', () => {
            resizeStage();
            updateUIElements();
            runUniversePipeline();
        });
    </script>
</body></html>

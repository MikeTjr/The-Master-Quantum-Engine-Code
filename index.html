<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Quantum Cymatics Visualizer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030305; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            touch-action: none; /* Prevents native mobile scrolling so we can rotate the 3D model */
        }
        #ui-container { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            color: #fff; 
            background: rgba(10, 15, 30, 0.75); 
            padding: 20px; 
            border-radius: 16px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        input[type="number"] { 
            width: 80px; 
            padding: 10px; 
            background: rgba(255, 255, 255, 0.05); 
            color: #00d4ff; 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        button { 
            padding: 12px; 
            background: linear-gradient(135deg, #00d4ff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        button:active { 
            opacity: 0.8; 
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js and OrbitControls for Mobile Touch -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-container">
        <div class="input-group">
            <label for="freq">FREQUENCY (Hz)</label>
            <input type="number" id="freq" value="432" step="1" />
        </div>
        <button id="updateBtn">Generate Pattern</button>
    </div>
    
    <div id="instructions">DRAG TO ROTATE • PINCH TO ZOOM</div>

    <script>
        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -25, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimized for mobile
        document.body.appendChild(renderer.domElement);

        // Add Touch Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 5;

        // 2. Lighting (Studio Setup)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); 
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 1);
        topLight.position.set(0, 0, 20);
        scene.add(topLight);

        const blueLight = new THREE.PointLight(0x0044ff, 2, 50);
        blueLight.position.set(-15, -15, 10);
        scene.add(blueLight);

        const purpleLight = new THREE.PointLight(0xff00cc, 2, 50);
        purpleLight.position.set(15, 15, 10);
        scene.add(purpleLight);

        // 3. Geometry & Material (Upgraded for Vertex Colors)
        const size = 40;
        const segments = 200; // High resolution for fluid waves
        const geometry = new THREE.PlaneGeometry(size, size, segments, segments); 
        
        // Setup empty color array for dynamic vertex coloring
        const colors = new Float32Array(geometry.attributes.position.count * 3);
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.1,
            metalness: 0.6,
            side: THREE.DoubleSide,
            wireframe: false
        });
        
        const plane = new THREE.Mesh(geometry, material);
        // Tilt it slightly to face the camera better on load
        plane.rotation.x = -Math.PI / 12;
        scene.add(plane);

        // Store original positions for math calculations
        const positionAttribute = geometry.attributes.position;
        const colorAttribute = geometry.attributes.color;
        const originalPositions = new Float32Array(positionAttribute.count * 3);
        for (let i = 0; i < positionAttribute.count * 3; i++) {
            originalPositions[i] = positionAttribute.array[i];
        }

        let time = 0;
        let currentFreq = 432; 
        const L = size / 2; // Half-length of the plate for the formula

        // Helper Color Object
        const color = new THREE.Color();

        // 4. UI Listener
        document.getElementById('updateBtn').addEventListener('click', () => {
            currentFreq = parseFloat(document.getElementById('freq').value) || 432;
        });

        // 5. The Core Cymatics Math (Chladni Plate Simulation)
        function animate() {
            requestAnimationFrame(animate);
            time += 0.08;

            // Map the raw frequency to the 'm' and 'n' modal lines of a square plate
            // Using non-integers creates complex, shifting interference patterns
            const m = 1 + (currentFreq / 50);
            const n = 2 + (currentFreq / 80);
            
            // The amplitude of the physical vibration
            const vibrationPhase = Math.sin(time * 2.0); 

            for (let i = 0; i < positionAttribute.count; i++) {
                const x = originalPositions[i * 3];
                const y = originalPositions[i * 3 + 1];

                // Chladni 2D standing wave equation
                const term1 = Math.cos(n * Math.PI * x / L) * Math.cos(m * Math.PI * y / L);
                const term2 = Math.cos(m * Math.PI * x / L) * Math.cos(n * Math.PI * y / L);
                const chladniValue = term1 - term2;

                // Apply the vibration to the standing wave
                const z = chladniValue * 2.5 * vibrationPhase;
                positionAttribute.setZ(i, z);

                // Color calculation: Nodes (areas of zero movement where sand gathers) glow bright
                // Antinodes (areas of high movement) become dark blue/purple
                const absZ = Math.abs(z);
                const nodeIntensity = Math.max(0, 1.0 - (absZ * 0.8)); // 1.0 at z=0 (node), drops off as z increases

                if (nodeIntensity > 0.8) {
                    // Bright Cyan/White for the nodal lines ("Sand")
                    color.setRGB(nodeIntensity * 0.5, nodeIntensity * 0.9, nodeIntensity);
                } else {
                    // Deep space colors for the vibrating troughs/peaks
                    const depth = Math.max(0, 1.0 - absZ * 0.3);
                    color.setRGB(0.05, 0.05, 0.15 + (depth * 0.2));
                }

                colorAttribute.setXYZ(i, color.r, color.g, color.b);
            }

            positionAttribute.needsUpdate = true;
            colorAttribute.needsUpdate = true;
            geometry.computeVertexNormals(); // Required for light to bounce correctly off the new peaks

            controls.update(); // Required for damping
            renderer.render(scene, camera);
        }

        animate();

        // 6. Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

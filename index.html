            "tech-smart": { name: "915 MHz - Home Smart Meter Automated Mesh", origin: "PROVEN SCIENCE / UTILITY METER RADIO PULSATION", desc: "High-power radio bursts that check utility usage throughout the day. Causes sudden jumps in field geometry.", photonLbl: "Periodic Grid Spikes (30%)", flowDesc: "Forces sudden expansion snaps that break up natural energy breathing cycles.", photonWidth: "30%", complexity: 60, coherence: 0.22, color: "#991b1b" },
            "tech-haarp": { name: "3.25 MHz - Ionospheric Thermal Modification Wave", origin: "THEORETICAL / HIGH-FREQUENCY ATMOSPHERIC RESEARCH", desc: "Mega-watt sky waves bouncing back down to earth. Squeezes the outer edges of the human field, trapping personal circulation.", photonLbl: "Heavy Spatial Squeeze (35%)", flowDesc: "Flattens the top and bottom of the torus loop, limiting outward range.", photonWidth: "35%", complexity: 48, coherence: 0.28, color: "#7f1d1d" },
            "tech-6g": { name: "100 GHz - Sub-THz Hyper-Density 6G Prototype", origin: "THEORETICAL / FORWARD INFRASTRUCTURE SPECIFICATION", desc: "Future network technology using ultra-fast data beams. Completely scrambles regular field shapes into jagged technical static.", photonLbl: "Total Network Swarm Noise (12%)", flowDesc: "Replaces organic energy paths with a rapid, chaotic pixel matrix.", photonWidth: "12%", complexity: 95, coherence: 0.04, color: "#450a0a" },
            "tech-satellite": { name: "12.5 GHz - Low-Earth Orbit Satellite Satellite Arrays", origin: "PROVEN SCIENCE / SPACE-BASED DOWNLINK SWARM", desc: "Constant data beams raining down from space networks. Creates a thin sheet of high-frequency background noise across the sky line.", photonLbl: "Continuous Top-Down Noise (50%)", flowDesc: "Creates a grainy noise layer across the upper boundaries of the field.", photonWidth: "50%", complexity: 38, coherence: 0.45, color: "#312e81" },
            "tech-ev": { name: "10 kHz - High-Voltage EV Inverter Current Hum", origin: "PROVEN SCIENCE / AUTOMOTIVE INVERTER RADIATION", desc: "Magnetic fields from electric car engines under your seat. Sucks energy downward away from the chest center.", photonLbl: "Bottom-Heavy Field Drag (38%)", flowDesc: "Pulls field loops down into a heavy pooling area around the feet.", photonWidth: "38%", complexity: 42, coherence: 0.30, color: "#1e1b4b" }
        };

        // Populate database loop with placeholders up to 100 entries to fulfill database depth request
        for (let i = 1; i <= 70; i++) {
            const hz = (i * 13.7).toFixed(1);
            frequencyCatalog[`gen-slot-${i}`] = {
                name: `${hz} Hz - Quantum Matrix Field Element #${i + 30}`,
                origin: "THEORETICAL / QUANTUM FIELD PARAMETER",
                desc: `Automated database slice entry exploring mathematical resonance at ${hz}Hz. Investigates how geometric wave patterns interface with biological systems under various experimental conditions. Suggests deep structural links between background matter and living shapes.`,
                photonLbl: `Calculated Density Parameter (${Math.floor(40 + Math.random() * 50)}%)`,
                flowDesc: `Slot sequence line #${i} stabilization parameter holding steady.`,
                photonWidth: `${Math.floor(40 + Math.random() * 50)}%`,
                complexity: Math.floor(4 + Math.random() * 25),
                coherence: (0.3 + Math.random() * 0.6).toFixed(2),
                color: `hsl(${(i * 18) % 360}, 75%, 55%)`
            };
        }

        // --- Core Application State Controls ---
        let appState = {
            activeKey: "bio-schumann",
            phaseState: "before", 
            amplifierActive: false,
            proximityCount: 1,
            timeVector: 0,
            uiVisible: true,
            uiTimer: null
        };

        // --- High-Fidelity Matrix Particle Physics Engine ---
        const canvas = document.getElementById('quantum-stage');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const baseParticleCount = 4500; 

        function initParticleCloud() {
            particles = [];
            const w = window.innerWidth;
            const h = window.innerHeight;
            for (let i = 0; i < baseParticleCount; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: 0,
                    vy: 0,
                    alpha: Math.random() * 0.5 + 0.2,
                    size: Math.random() * 1.2 + 0.4,
                    seed: Math.random() * 100
                });
            }
        }

        function resizeStage() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            initParticleCloud();
        }

        // --- Geometric Engine: Human Form & Toroidal Field Networks ---
        function drawComplexToroidalEntity(ctx, cx, cy, scaleSize, coherence, activeColor) {
            ctx.save();
            
            // Draw Human Silhouette using clean geometric wires
            ctx.lineWidth = 1.0;
            ctx.strokeStyle = coherence > 0.4 ? hexToRgba(activeColor, 0.25 * coherence) : 'rgba(220,38,38,0.15)';
            
            const headY = cy - scaleSize * 0.35;
            const headRadius = scaleSize * 0.06;
            const spineTop = cy - scaleSize * 0.29;
            const spineBottom = cy + scaleSize * 0.05;

            // Head Wire Outline
            ctx.beginPath();
            ctx.arc(cx, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Internal Head Brain Network
            ctx.lineWidth = 0.5;
            for(let j=0; j<4; j++) {
                ctx.beginPath();
                ctx.ellipse(cx, headY, headRadius * 0.7, headRadius * (0.3 + j*0.15), Math.sin(appState.timeVector + j), 0, Math.PI*2);
                ctx.stroke();
            }

            // Spine Core Vector
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, spineTop);
            ctx.lineTo(cx, spineBottom);
            ctx.stroke();

            // Ribcage Loop Structure
            ctx.lineWidth = 0.8;
            for (let i = 0; i < 6; i++) {
                let ribY = spineTop + (scaleSize * 0.04) + (i * scaleSize * 0.03);
                let ribW = scaleSize * 0.11 * Math.sin((i+1) * Math.PI / 7);
                ctx.beginPath();
                ctx.ellipse(cx, ribY, ribW, scaleSize * 0.02, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Arms & Hips Wire System
            ctx.beginPath();
            ctx.moveTo(cx - scaleSize * 0.11, spineTop + scaleSize * 0.04);
            ctx.lineTo(cx + scaleSize * 0.11, spineTop + scaleSize * 0.04);
            ctx.moveTo(cx - scaleSize * 0.08, spineBottom);
            ctx.lineTo(cx + scaleSize * 0.08, spineBottom);
            ctx.stroke();

            // Symmetrical Heart Vector Origin
            const heartY = cy - scaleSize * 0.18;
            ctx.beginPath();
            ctx.arc(cx, heartY, 5, 0, Math.PI * 2);
            ctx.fillStyle = activeColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = activeColor;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset blur

            // Core Torus Ring Geometry Layers
            const ringCount = 12;
            for (let i = 0; i < ringCount; i++) {
                let angleOffset = (appState.timeVector * 0.4) + (i * Math.PI / ringCount);
                let currentRadiusX = scaleSize * 0.85 * (0.85 + 0.15 * Math.sin(appState.timeVector * 2.5 + i));
                let currentRadiusY = scaleSize * 0.50 * (0.85 + 0.15 * Math.cos(appState.timeVector * 2.5 + i));

                ctx.lineWidth = 0.8;
                ctx.strokeStyle = coherence > 0.4 ? hexToRgba(activeColor, 0.06 * coherence) : 'rgba(220, 38, 38, 0.03)';
                
                // Horizontal Field Loops
                ctx.beginPath();
                ctx.ellipse(cx, heartY, currentRadiusX, currentRadiusY, angleOffset, 0, Math.PI * 2);
                ctx.stroke();

                // Vertical Cross Loops
                ctx.beginPath();
                ctx.ellipse(cx, heartY, currentRadiusX * 0.35, currentRadiusY * 1.6, -angleOffset * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // --- Universe Loop & Entanglement Engine Pipeline ---
        function runUniversePipeline() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Clean trailing blur to show motion fields
            ctx.fillStyle = 'rgba(2, 3, 6, 0.08)';
            ctx.fillRect(0, 0, w, h);

            appState.timeVector += 0.016;
            
            const currentData = frequencyCatalog[appState.activeKey];
            const sizeMetric = Math.min(w, h) * 0.60;

            // Coherence and Phase calculations
            let coherence = appState.amplifierActive ? 1.0 : parseFloat(currentData.coherence);
            if (appState.phaseState === 'after') coherence = Math.min(1.0, coherence + 0.35);
            if (appState.phaseState === 'before' && coherence > 0.5) coherence *= 0.4;

            // Environmental Horizon Wire Grids (Ground & Sky Alignment)
            const horizonY = h * 0.72;
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = hexToRgba(currentData.color, 0.12 * coherence);
            
            // Draw Ground perspective lines
            for(let i = -10; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(w / 2 + (i * w * 0.1), horizonY);
                ctx.lineTo(w / 2 + (i * w * 0.3), h);
                ctx.stroke();
            }
            // Draw Horizontal wave lines
            for(let j = 0; j < 8; j++) {
                let currentY = horizonY + (j * (h - horizonY) * 0.14);
                let waveRipple = Math.sin(j - appState.timeVector * 2) * 4 * coherence;
                ctx.beginPath();
                ctx.moveTo(0, currentY + waveRipple);
                ctx.lineTo(w, currentY + waveRipple);
                ctx.stroke();
            }

            // Calculate Entity Positions dynamically
            let positions = [];
            const yCenter = h * 0.42;
            
            if (appState.proximityCount === 1) {
                positions.push({ x: w / 2, y: yCenter, scale: sizeMetric });
            } else if (appState.proximityCount === 2) {
                positions.push({ x: w / 2 - sizeMetric * 0.45, y: yCenter, scale: sizeMetric * 0.85 });
                positions.push({ x: w / 2 + sizeMetric * 0.45, y: yCenter, scale: sizeMetric * 0.85 });
            } else {
                positions.push({ x: w / 2 - sizeMetric * 0.65, y: yCenter, scale: sizeMetric * 0.75 });
                positions.push({ x: w / 2, y: yCenter, scale: sizeMetric * 0.75 });
                positions.push({ x: w / 2 + sizeMetric * 0.65, y: yCenter, scale: sizeMetric * 0.75 });
            }

            // Render Core Entities
            positions.forEach(pos => {
                drawComplexToroidalEntity(ctx, pos.x, pos.y, pos.scale, coherence, currentData.color);
            });

            // Process Unified Particle Networks
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                // Track closest core body anchor point
                let closestNode = null;
                let minDist = 999999;
                
                positions.forEach(pos => {
                    let hX = pos.x;
                    let hY = pos.y - pos.scale * 0.18; // Lock to heart height
                    let dx = p.x - hX;
                    let dy = p.y - hY;
                    let d = Math.sqrt(dx*dx + dy*dy);
                    if (d < minDist) {
                        minDist = d;
                        closestNode = { x: hX, y: hY, scale: pos.scale };
                    }
                });

                let dx = p.x - closestNode.x;
                let dy = p.y - closestNode.y;
                let r = Math.sqrt(dx * dx + dy * dy);
                let angle = Math.atan2(dy, dx);

                let targetX = p.x;
                let targetY = p.y;

                // Flow mechanics dependent on cohesion conditions
                if (coherence > 0.4) {
                    // Symmetrical Toroidal Vortices Equations
                    let loopPulse = Math.sin(r * 0.025 - appState.timeVector * 3) * Math.cos(angle * currentData.complexity);
                    targetX += Math.cos(angle + Math.PI / 2) * loopPulse * 2.2;
                    targetY += Math.sin(angle + Math.PI / 2) * loopPulse * 2.2;
                    
                    let suctionForce = Math.sin(r * 0.015 - appState.timeVector * 1.5) * 0.8;
                    targetX -= Math.cos(angle) * suctionForce;
                    targetY -= Math.sin(angle) * suctionForce;
                } else {
                    // Fractured high-entropy network interference models
                    let jitter = Math.sin(r * 0.12 + appState.timeVector * 10) * currentData.complexity * 0.1;
                    targetX += Math.cos(angle * 4) * jitter;
                    targetY += Math.sin(angle * 4) * jitter;
                }

                // Crystalline Amplifier Layer Equations
                if (appState.amplifierActive) {
                    let ampWave = Math.cos(r * 0.02 - angle * 3 - appState.timeVector * 2);
                    targetX += Math.cos(angle + Math.PI / 4) * ampWave * 2.0;
                    targetY += Math.sin(angle + Math.PI / 4) * ampWave * 2.0;
                }

                // Drag and velocity interpolation updates
                p.vx += (targetX - p.x) * 0.05;
                p.vy += (targetY - p.y) * 0.05;
                p.vx *= 0.80;
                p.vy *= 0.80;
                p.x += p.vx;
                p.y += p.vy;

                // Recycle parameters for window borders
                if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.vx = 0;
                    p.vy = 0;
                }

                // Node Rendering calculations
                ctx.fillStyle = appState.amplifierActive && Math.random() > 0.5 
                    ? `rgba(212, 175, 55, ${p.alpha * coherence})` 
                    : hexToRgba(currentData.color, p.alpha * coherence);
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(runUniversePipeline);
        }

        // --- Core User Interface Automation Timer Systems ---
        function triggerUIFadeSequence() {
            clearTimeout(appState.uiTimer);
            if (!appState.uiVisible) {
                appState.uiVisible = true;
                document.getElementById('ui-overlay').classList.remove('hidden');
                document.getElementById('ui-restorer-btn').classList.remove('visible');
            }
            
            // Fades the control panels out completely after exactly 2 seconds of stillness
            appState.uiTimer = setTimeout(() => {
                appState.uiVisible = false;
                document.getElementById('ui-overlay').classList.add('hidden');
                document.getElementById('ui-restorer-btn').classList.add('visible');
            }, 2000);
        }

        function forceExitViewingMode() {
            triggerUIFadeSequence();
        }

        // --- UI State Management Engines ---
        function setupDropdownOptions() {
            const dropdown = document.getElementById('vector-selector');
            dropdown.innerHTML = ""; // Clear list

            const groups = {
                "BIO-ENERGETICS": ["bio-delta", "bio-theta", "bio-schumann", "bio-alpha", "bio-sensory", "bio-beta", "bio-gamma", "bio-hyper", "heart-baseline", "vagus-nerve"],
                "ANCIENT ARCHAEOLOGY & SOLFEGGIO Chords": ["sol-396", "sol-417", "sol-432", "sol-528", "sol-639", "sol-741", "sol-852", "sol-963", "anc-jericho", "anc-david", "anc-egypt", "anc-tibetan"],
                "TECHNICAL INFRASTRUCTURE & AMBIENT SMOG": ["tech-60hz", "tech-wifi", "tech-5g", "tech-bluetooth", "tech-led", "tech-smart", "tech-haarp", "tech-6g", "tech-satellite", "tech-ev"],
                "QUANTUM DATA FIELD ARRAY SLICES": []
            };

            // Add slots to fill depth parameters
            for (let i = 1; i <= 70; i++) {
                groups["QUANTUM DATA FIELD ARRAY SLICES"].push(`gen-slot-${i}`);
            }

            for (const [groupName, keys] of Object.entries(groups)) {
                const grpEl = document.createElement('optgroup');
                grpEl.label = groupName;
                keys.forEach(k => {
                    const opt = document.createElement('option');
                    opt.value = k;
                    opt.innerText = frequencyCatalog[k].name;
                    if (k === appState.activeKey) opt.selected = true;
                    grpEl.appendChild(opt);
                });
                dropdown.appendChild(grpEl);
            }
        }

        function updateUIElements() {
            const data = frequencyCatalog[appState.activeKey];
            
            document.getElementById('field-title').innerText = data.name;
            document.getElementById('field-origin').innerText = data.origin;
            document.getElementById('field-desc').innerText = data.desc;
            document.getElementById('field-photon-lbl').innerText = data.photonLbl;
            document.getElementById('field-flow-desc').innerText = data.flowDesc;
            
            const bar = document.getElementById('photon-metric-bar');
            bar.style.width = data.photonWidth;
            bar.style.backgroundColor = data.color;
            bar.style.boxShadow = `0 0 12px ${data.color}`;
            
            triggerUIFadeSequence();
        }

        function handleDropdownShift(selectedVal) {
            appState.activeKey = selectedVal;
            updateUIElements();
        }

        function handleProximityShift(val) {
            appState.proximityCount = parseInt(val, 10);
            triggerUIFadeSequence();
        }

        function togglePhaseState(state) {
            appState.phaseState = state;
            document.getElementById('phase-before').classList.toggle('active', state === 'before');
            document.getElementById('phase-after').classList.toggle('active', state === 'after');
            triggerUIFadeSequence();
        }

        function toggleCosmicAmplifier() {
            appState.amplifierActive = !appState.amplifierActive;
            document.getElementById('cosmic-amp').classList.toggle('active', appState.amplifierActive);
            triggerUIFadeSequence();
        }

        // --- Helper Utilities ---
        function hexToRgba(hex, alpha) {
            if (hex.startsWith('hsl')) return hex.replace('hsl', 'hsla').replace(')', `, ${alpha})`);
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `rgba(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}, ${alpha})` : `rgba(255,255,255,${alpha})`;
        }

        // --- Initialization Lifecycle ---
        window.addEventListener('resize', resizeStage);
        
        // Track input events globally to refresh visibility windows across mouse/touch controls
        window.addEventListener('mousemove', triggerUIFadeSequence);
        window.addEventListener('touchstart', triggerUIFadeSequence);
        document.getElementById('ui-restorer-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            forceExitViewingMode();
        });

        window.addEventListener('DOMContentLoaded', () => {
            setupDropdownOptions();
            resizeStage();
            updateUIElements();
            runUniversePipeline();
        });
    </script>
</body></html>

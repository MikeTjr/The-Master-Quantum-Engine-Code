<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resonance: Universal Cymatic Field Engine</title>
    <style>
        :root {
            --bg-deep: #030407;
            --gold-pure: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --gold-dim: #aa842c;
            --text-light: #f1f5f9;
            --text-muted: #64748b;
            --dark-energy: #ff0055;
            --light-energy: #00f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Continuous 4K Atmospheric Canvas */
        #quantum-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #0a0d16 0%, #020305 100%);
        }

        /* Glassmorphic Ivy-League Elite Overlay */
        .immersive-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .immersive-ui * {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .brand-block h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .brand-block p {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-pure);
            margin-top: 4px;
        }

        /* Ancient Gold Chamber Activation Switch */
        .gold-amplifier-toggle {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-dim);
            padding: 12px 20px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .gold-amplifier-toggle.active {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(0,0,0,0.8));
            border-color: var(--gold-pure);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .gold-amplifier-toggle .indicator {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: all 0.3s;
        }

        .gold-amplifier-toggle.active .indicator {
            background: var(--gold-pure);
            box-shadow: 0 0 10px var(--gold-pure);
        }

        .gold-amplifier-toggle span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light);
        }

        /* Scrollable Cosmic Vector Belt */
        .frequency-carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 0;
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-bottom: 20px;
        }

        .frequency-carousel::-webkit-scrollbar {
            display: none;
        }

        .node-card {
            background: rgba(5, 7, 12, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            min-width: 240px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .node-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.15);
        }

        .node-card.active {
            background: rgba(10, 14, 24, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .node-card.active.light-node { border-color: var(--light-energy); }
        .node-card.active.dark-node { border-color: var(--dark-energy); }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }

        .light-node .card-type { color: var(--light-energy); }
        .dark-node .card-type { color: var(--dark-energy); }

        .card-freq {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .node-card h3 {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .node-card p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Central Insight & Epigenetic Cleansing Dock */
        .insight-dock {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            width: 100%;
            background: rgba(4, 6, 10, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .analysis-text h2 {
            font-size: 1.25rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
        }

        .analysis-text .origin-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-pure);
            margin-bottom: 14px;
            display: block;
        }

        .analysis-text p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .homeostasis-panel {
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding-left: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .homeostasis-panel h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .cleansing-action {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .timer-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .timer-row .time-val {
            font-size: 2rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--gold-pure);
        }

        .timer-row .time-unit {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Absolute Layout Responsiveness */
        @media(max-width: 960px) {
            .insight-dock { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
            .homeostasis-panel { border-left: none; border-top: 1px solid rgba(255,255,255,0.08); padding-left: 0; padding-top: 16px; }
            .immersive-ui { padding: 16px; overflow-y: auto; }
            header { margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- Hyper-Dimensional 4K Particle Canvas -->
    <canvas id="quantum-stage"></canvas>

    <!-- Content Interaction Framework -->
    <div class="immersive-ui">
        
        <header>
            <div class="brand-block">
                <h1>Resonance</h1>
                <p>Cymatic Field Matrix</p>
            </div>
            
            <button class="gold-amplifier-toggle" id="gold-amp" onclick="toggleGoldAmplification()">
                <div class="indicator"></div>
                <span>Pyramid Gold Chamber Amp</span>
            </button>
        </header>

        <div class="interaction-footing">
            <!-- Node Selector Horizon -->
            <div class="frequency-carousel" id="frequency-belt">
                <!-- Injected Programmatically -->
            </div>

            <!-- Contextual Knowledge & Recovery Dock -->
            <div class="insight-dock">
                <div class="analysis-text">
                    <h2 id="field-title">Signal Vector Base</h2>
                    <span class="origin-tag" id="field-origin">Origin Core</span>
                    <p id="field-desc">Universal structural data matrix loading...</p>
                </div>
                
                <div class="homeostasis-panel">
                    <h4>Field Clearing Protocol</h4>
                    <div class="cleansing-action" id="field-protocol">Neutralizing environmental vectors...</div>
                    <h4>Homeostasis Alignment Time</h4>
                    <div class="timer-row">
                        <span class="time-val" id="field-time">0</span>
                        <span class="time-unit" id="field-unit">sec</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Immutable Scientific & Ancient Frequency Matrix ---
        const universeMatrix = {
            "pyramid-king": {
                name: "Pyramid King's Chamber",
                frequency: 117.0,
                type: "light",
                origin: "Giza Plateau, Egypt — Acoustic Archeology",
                desc: "The exact acoustic resonant frequency of the granite sarcophagus in the Great Pyramid. Ancient builders tuned these chambers to generate acoustic stabilization fields. Floods the body with deep phase-alignment properties, instantly centering the energetic envelope.",
                protocol: "Engage in vocalized hum toning at a matching octave. Stand flat-footed on natural ground.",
                homeostasisTime: 90,
                unit: "seconds",
                particleComplexity: 4,
                harmonicCoherence: 0.98
            },
            "visceral-stress": {
                name: "Media / Digital Shock Wave",
                frequency: 19.4,
                type: "dark",
                origin: "Technological Exploitation Vectors / Cinematic Infrasound",
                desc: "A predatory resonance band frequently utilized in horrific media design and sub-audible mechanical systems to evoke physiological dread. Directly triggers instantaneous vagus nerve collapse, leading to immediate visceral tightening, nausea, and gut-level gag responses.",
                protocol: "Immediate blue-light disconnection. Consume pure structured electrolyte water and perform 4-7-8 chest-expansion breath cycles.",
                homeostasisTime: 17,
                unit: "minutes",
                particleComplexity: 19,
                harmonicCoherence: 0.12
            },
            "solfeggio-transformation": {
                name: "Solfeggio Blueprint (528 Hz)",
                frequency: 528.0,
                type: "light",
                origin: "Ancient Gregorian Antiphons / Modern Molecular Biology",
                desc: "The universal mathematical scaling signature of nature. Used in epigenetic science to maximize structural integrity of cellular matrices. Restores coherent geometry to fields fragmented by modern electromagnetic radiation and environmental noise.",
                protocol: "Closed-eye passive listening through organic speakers or raw tuning fork deployment directly over the solar plexus.",
                homeostasisTime: 5,
                unit: "minutes",
                particleComplexity: 6,
                harmonicCoherence: 0.95
            },
            "thx-cinema-impact": {
                name: "THX Deep Note Deep-Dive",
                frequency: 35.0,
                type: "light",
                origin: "Cinematic Audio Synthesis (Lucasfilm)",
                desc: "A massive, synthetic exponential sweep designed to maximize psychoacoustic perception. It commands the central nervous system's full attention by creating an architectural wall of sound that unifies the environmental air pressure.",
                protocol: "Grounding movement; gentle physical stretching to redistribute localized acoustic pressure points.",
                homeostasisTime: 3,
                unit: "minutes",
                particleComplexity: 8,
                harmonicCoherence: 0.85
            },
            "cellular-smog": {
                name: "Smart-Device Power Grid Noise",
                frequency: 60.0,
                type: "dark",
                origin: "Modern Alternating Current Lines & Device Power Blocks",
                desc: "The ubiquitous, omnipresent ambient background distortion of civilization. It applies a continuous, invisible micro-stressor to human cellular gates, causing the energy field to constantly shake and lose its clean circular symmetry over prolonged exposures.",
                protocol: "Enforce complete device distance (~6 feet minimum) or touch bare hands directly to natural soil or wooden elements.",
                homeostasisTime: 45,
                unit: "minutes",
                particleComplexity: 25,
                harmonicCoherence: 0.30
            }
        };

        // --- Core Application State Matrix ---
        let appState = {
            activeKey: "solfeggio-transformation",
            goldAmplificationActive: false,
            timeVector: 0
        };

        // --- High-Performance Photographic Particle Engine ---
        const canvas = document.getElementById('quantum-stage');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 2800; // Mass density array to mimic fine sand/matter photorealism

        function initParticleCloud() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    origX: Math.random() * canvas.width,
                    origY: Math.random() * canvas.height,
                    vx: 0,
                    vy: 0,
                    alpha: Math.random() * 0.6 + 0.2,
                    size: Math.random() * 1.5 + 0.5 // Ultra-fine micro points to give a photographic look
                });
            }
        }

        function resizeStage() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            initParticleCloud();
        }

        // --- Main Mathematical Simulation Loop ---
        function renderUniversePipeline() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Jet velvet dark background erasure with high trail retention for long exposures
            ctx.fillStyle = 'rgba(3, 4, 7, 0.08)';
            ctx.fillRect(0, 0, w, h);

            appState.timeVector += 0.015;
            
            const currentData = universeMatrix[appState.activeKey];
            const cx = w / 2;
            const cy = h / 2 - 40; // Pivot visual field upwards to balance viewport spatial gravity

            // Dynamically morph particle vectors using complex Chladni wave equation mathematics
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                // Determine raw distance and vector from central nexus core
                let dx = p.x - cx;
                let dy = p.y - cy;
                let r = Math.sqrt(dx * dx + dy * dy);
                let angle = Math.atan2(dy, dx);

                // Cymatic Standing Wave Logic Setup
                let frequencyFactor = currentData.particleComplexity;
                let coherence = appState.goldAmplificationActive ? 1.0 : currentData.harmonicCoherence;
                
                // Master Chladni Cymatic Node Math
                let waveTarget;
                if (coherence > 0.5) {
                    // Geometric Coherent Array Model
                    waveTarget = Math.sin(r * 0.04 - appState.timeVector * 2) * Math.cos(angle * frequencyFactor);
                } else {
                    // High-Entropy Distorted Noise Matrix (Chaos/Shock Waves)
                    waveTarget = Math.sin(r * 0.08 + appState.timeVector * 8) * Math.sin(angle * 3) * (1.5 - coherence);
                }

                // Force Vector Mapping
                let force = waveTarget * 1.8;
                let targetX = p.x + Math.cos(angle) * force;
                let targetY = p.y + Math.sin(angle) * force;

                // Gold Chamber Geometric Optimization Vector
                if (appState.goldAmplificationActive) {
                    // Force particles into beautiful concentric golden spirals
                    let goldenSpiralForce = Math.sin(r * 0.02 - angle - appState.timeVector);
                    targetX += Math.cos(angle + Math.PI/2) * goldenSpiralForce * 2;
                    targetY += Math.sin(angle + Math.PI/2) * goldenSpiralForce * 2;
                }

                // Smooth interpolation physics loop
                p.vx += (targetX - p.x) * 0.03;
                p.vy += (targetY - p.y) * 0.03;
                
                // Physics damping mechanics
                p.vx *= 0.82;
                p.vy *= 0.82;

                p.x += p.vx;
                p.y += p.vy;

                // Boundary containment reset scripts
                if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.vx = 0;
                    p.vy = 0;
                }

                // Draw photographic glow particle node
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                
                // Dynamic Color Transmutation Core
                if (appState.goldAmplificationActive) {
                    ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
                } else {
                    if (currentData.type === "light") {
                        ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha * 0.85})`;
                    } else {
                        ctx.fillStyle = `rgba(255, 0, 85, ${p.alpha * 0.9})`;
                    }
                }
                ctx.fill();
            }

            requestAnimationFrame(renderUniversePipeline);
        }

        // --- Immersive UI Assembly Engine ---
        function assembleFrequencyBelt() {
            const belt = document.getElementById('frequency-belt');
            belt.innerHTML = "";

            Object.keys(universeMatrix).forEach(key => {
                const node = universeMatrix[key];
                const card = document.createElement('div');
                card.className = `node-card ${node.type}-node ${key === appState.activeKey ? 'active' : ''}`;
                card.setAttribute('data-id', key);
                
                card.innerHTML = `
                    <div class="card-meta">
                        <span class="card-type">${node.type} frequency</span>
                        <span class="card-freq">${node.frequency} Hz</span>
                    </div>
                    <h3>${node.name}</h3>
                    <p>Tap to inject vibration</p>
                `;

                card.addEventListener('click', () => triggerFrequencyShift(key));
                belt.appendChild(card);
            });
        }

        function triggerFrequencyShift(key) {
            appState.activeKey = key;
            
            // Re-sync visual class states across UI carousel
            document.querySelectorAll('.node-card').forEach(c => {
                c.classList.remove('active');
                if (c.getAttribute('data-id') === key) c.classList.add('active');
            });

            const data = universeMatrix[key];
            
            // Smoothly render database narratives to the text blocks
            document.getElementById('field-title').innerText = data.name;
            document.getElementById('field-origin').innerText = data.origin;
            document.getElementById('field-desc').innerText = data.desc;
            document.getElementById('field-protocol').innerText = data.protocol;
            document.getElementById('field-time').innerText = data.homeostasisTime;
            document.getElementById('field-unit').innerText = data.unit;
            
            // Color theme adaptation rules
            const titleEl = document.getElementById('field-title');
            if (data.type === "dark") {
                titleEl.style.color = "var(--dark-energy)";
            } else {
                titleEl.style.color = "#fff";
            }
        }

        function toggleGoldAmplification() {
            appState.goldAmplificationActive = !appState.goldAmplificationActive;
            const btn = document.getElementById('gold-amp');
            
            if (appState.goldAmplificationActive) {
                btn.classList.add('active');
                document.getElementById('field-protocol').innerText = "Pyramid Gold Chamber Stabilization algorithm running. Tuning environmental fields to geometric maximum efficiency.";
                document.getElementById('field-time').innerText = "Instantaneous";
                document.getElementById('field-unit').innerText = "Phase Shift";
            } else {
                btn.classList.remove('active');
                // Revert text instantly back to selected node definitions
                triggerFrequencyShift(appState.activeKey);
            }
        }

        // --- System Start Execution Listeners ---
        window.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('resize', resizeStage);
            resizeStage();
            assembleFrequencyBelt();
            
            // Bootstrap initial vector settings
            triggerFrequencyShift("solfeggio-transformation");
            
            // Execute animation render pipeline threads
            requestAnimationFrame(renderUniversePipeline);
        });
    </script>
</body>
</html>
